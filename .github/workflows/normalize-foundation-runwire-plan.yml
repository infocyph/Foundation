name: Normalize Foundation Runwire Plan

on:
  push:
    branches:
      - foundation-3/runwire-launch-plan

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation-3/runwire-launch-plan
      - run: python3 .github/normalize-foundation-runwire-plan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: normalize canonical Foundation Runwire plan"
          git push origin HEAD:foundation-3/runwire-launch-plan
