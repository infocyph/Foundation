name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master", "foundation-3/runtime-architecture-plan" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_extensions: "mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached"
      fail_on_skipped_tests: true
      integration_services: '["mysql","postgres","sqlite","redis","valkey","memcached"]'
      service_topologies: '{}'
      benchmark_composer_script: "benchmark:representative"
      benchmark_result_file: "build/benchmark-result.json"
      benchmark_max_regression_percent: 2

  maintenance-runtime-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          ini-values: opcache.enable_cli=1

      - name: Install benchmark dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Benchmark compiled maintenance gate
        env:
          FOUNDATION_MAINTENANCE_BENCHMARK_OUTPUT: build/maintenance-overhead.json
          FOUNDATION_MAINTENANCE_BENCHMARK_OPERATIONS: '25000'
          FOUNDATION_MAINTENANCE_BENCHMARK_WARMUP: '2500'
          FOUNDATION_MAINTENANCE_BENCHMARK_REPETITIONS: '5'
        run: composer benchmark:maintenance

      - name: Report maintenance benchmark
        if: always()
        run: |
          if [ -f build/maintenance-overhead.json ]; then
            cat build/maintenance-overhead.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-maintenance-overhead
          path: build/maintenance-overhead.json
          if-no-files-found: error
          retention-days: 30

  phase9-di-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: opcache.enable_cli=1

      - name: Install benchmark dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Benchmark direct InterMix versus Foundation generated DI
        env:
          PHASE9_DI_OUTPUT: build/phase9-di-attribution.json
          PHASE9_DI_OPERATIONS: '100000'
          PHASE9_DI_REPETITIONS: '7'
          PHASE9_DI_WARMUP: '1000'
        run: composer benchmark:phase9:di

      - name: Report Phase 9 DI attribution
        if: always()
        run: |
          if [ -f build/phase9-di-attribution.json ]; then
            cat build/phase9-di-attribution.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-phase9-di-${{ matrix.php }}
          path: build/phase9-di-attribution.json
          if-no-files-found: error
          retention-days: 30

  phase9-http-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: opcache.enable_cli=1

      - name: Install benchmark dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Benchmark standalone Webrick versus Foundation compiled HTTP
        env:
          PHASE9_HTTP_OUTPUT: build/phase9-http-attribution.json
          PHASE9_HTTP_OPERATIONS: '100000'
          PHASE9_HTTP_REPETITIONS: '7'
          PHASE9_HTTP_WARMUP: '1000'
        run: composer benchmark:phase9:http

      - name: Report Phase 9 HTTP attribution
        if: always()
        run: |
          if [ -f build/phase9-http-attribution.json ]; then
            cat build/phase9-http-attribution.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-phase9-http-${{ matrix.php }}
          path: build/phase9-http-attribution.json
          if-no-files-found: error
          retention-days: 30

  phase9-real-http-fpm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          ini-values: opcache.enable_cli=1

      - name: Install Foundation dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Install FPM and web servers
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-utils nginx php8.4-fpm php8.4-opcache

      - name: Benchmark compiled Foundation through Nginx and Apache PHP-FPM
        env:
          PHASE9_SERVER_REQUESTS: '20000'
          PHASE9_SERVER_CONCURRENCY: '32'
          PHASE9_SERVER_OUTPUT: build/phase9-server-benchmark.json
        run: bash benchmarks/phase9-real-server.sh

      - name: Report Phase 9 real-server evidence
        if: always()
        run: |
          if [ -f build/phase9-server-benchmark.json ]; then
            cat build/phase9-server-benchmark.json
          fi
          if [ -f build/phase9-nginx-error.log ]; then
            cat build/phase9-nginx-error.log
          fi
          if [ -f build/phase9-apache-error.log ]; then
            cat build/phase9-apache-error.log
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-phase9-real-http-fpm
          path: |
            build/phase9-server-benchmark.json
            build/phase9-server-compile.json
            build/phase9-server-results
            build/phase9-nginx-error.log
            build/phase9-apache-error.log
          if-no-files-found: warn
          retention-days: 30
