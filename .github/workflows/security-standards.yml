name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_extensions: "mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached"
      fail_on_skipped_tests: true
      integration_services: '["mysql","postgres","sqlite","redis","valkey","memcached"]'
      service_topologies: '{}'
      benchmark_composer_script: "benchmark:representative"
      benchmark_result_file: "build/benchmark-result.json"
      benchmark_max_regression_percent: 2

  maintenance-runtime-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          ini-values: opcache.enable_cli=1

      - name: Install benchmark dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Benchmark compiled maintenance gate
        env:
          FOUNDATION_MAINTENANCE_BENCHMARK_OUTPUT: build/maintenance-overhead.json
          FOUNDATION_MAINTENANCE_BENCHMARK_OPERATIONS: '25000'
          FOUNDATION_MAINTENANCE_BENCHMARK_WARMUP: '2500'
          FOUNDATION_MAINTENANCE_BENCHMARK_REPETITIONS: '5'
        run: composer benchmark:maintenance

      - name: Report maintenance benchmark
        if: always()
        run: |
          if [ -f build/maintenance-overhead.json ]; then
            cat build/maintenance-overhead.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-maintenance-overhead
          path: build/maintenance-overhead.json
          if-no-files-found: error
          retention-days: 30
