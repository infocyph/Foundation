name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_versions: '["8.4","8.5"]'
      php_extensions: "mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached"
      fail_on_skipped_tests: true
      integration_services: '["mysql","postgres","sqlite","redis","valkey","memcached"]'
      service_topologies: '{}'
      benchmark_composer_script: "benchmark:release"
      benchmark_result_file: "build/cachelayer-33-utilization.json"



  phpprobe-diagnostics:
    name: "PHPProbe candidate diagnostics"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Count near-miss candidates
        run: |
          php <<'PHP'
          <?php

          require __DIR__ . '/vendor/autoload.php';

          use Infocyph\PHPProbe\Detection\DuplicateCodeIndex;

          $files = [];
          foreach ([__DIR__ . '/src', __DIR__ . '/benchmarks'] as $root) {
              $iterator = new RecursiveIteratorIterator(
                  new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS),
              );
              foreach ($iterator as $file) {
                  if ($file->isFile() && $file->getExtension() === 'php') {
                      $files[] = $file->getPathname();
                  }
              }
          }
          sort($files);

          $options = [
              'normalize' => true,
              'fuzzy' => true,
          ];
          $index = (new DuplicateCodeIndex())->build($files, $options, true);

          $eligible = [];
          $byFile = [];
          foreach ($index['blocks'] as $file => $blocks) {
              foreach ($blocks as $block) {
                  $lines = $block['end_line'] - $block['start_line'] + 1;
                  if ($lines < 5 || count($block['statement_hashes']) < 4) {
                      continue;
                  }
                  $eligible[$block['type']][] = $block;
                  $relative = str_replace(__DIR__ . '/', '', $file);
                  $byFile[$relative] = ($byFile[$relative] ?? 0) + 1;
              }
          }

          $bound = static fn(int $left, int $right): float => min($left, $right) / max(1, max($left, $right));
          $comparisons = [];
          $total = 0;
          foreach ($eligible as $type => $blocks) {
              $count = count($blocks);
              $pairs = 0;
              for ($left = 0; $left < $count - 1; $left++) {
                  for ($right = $left + 1; $right < $count; $right++) {
                      $statement = $bound(count($blocks[$left]['statement_hashes']), count($blocks[$right]['statement_hashes']));
                      $shape = $bound(count($blocks[$left]['shape']), count($blocks[$right]['shape']));
                      if (round(($statement * 0.72) + ($shape * 0.28), 4) >= 0.85) {
                          $pairs++;
                      }
                  }
              }
              $comparisons[$type] = ['blocks' => $count, 'pairs' => $pairs];
              $total += $pairs;
          }

          uasort($comparisons, static fn(array $a, array $b): int => $b['pairs'] <=> $a['pairs']);
          arsort($byFile);

          echo "TOTAL_ELIGIBLE_BLOCKS=" . array_sum(array_column($comparisons, 'blocks')) . PHP_EOL;
          echo "TOTAL_NEAR_MISS_COMPARISONS=" . $total . PHP_EOL;
          echo "BY_TYPE=" . json_encode($comparisons, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          echo "TOP_FILES=" . json_encode(array_slice($byFile, 0, 40, true), JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL;

          $functionBlocks = $eligible['function'] ?? [];
          $pairContribution = [];
          $count = count($functionBlocks);
          for ($left = 0; $left < $count - 1; $left++) {
              for ($right = $left + 1; $right < $count; $right++) {
                  $statement = $bound(count($functionBlocks[$left]['statement_hashes']), count($functionBlocks[$right]['statement_hashes']));
                  $shape = $bound(count($functionBlocks[$left]['shape']), count($functionBlocks[$right]['shape']));
                  if (round(($statement * 0.72) + ($shape * 0.28), 4) < 0.85) {
                      continue;
                  }
                  foreach ([$functionBlocks[$left]['file'], $functionBlocks[$right]['file']] as $file) {
                      $relative = str_replace(__DIR__ . '/', '', $file);
                      $pairContribution[$relative] = ($pairContribution[$relative] ?? 0) + 1;
                  }
              }
          }
          arsort($pairContribution);
          echo "TOP_PAIR_CONTRIBUTORS=" . json_encode(array_slice($pairContribution, 0, 40, true), JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL;

          $blockContribution = [];
          for ($left = 0; $left < $count - 1; $left++) {
              for ($right = $left + 1; $right < $count; $right++) {
                  $statement = $bound(count($functionBlocks[$left]['statement_hashes']), count($functionBlocks[$right]['statement_hashes']));
                  $shape = $bound(count($functionBlocks[$left]['shape']), count($functionBlocks[$right]['shape']));
                  if (round(($statement * 0.72) + ($shape * 0.28), 4) < 0.85) {
                      continue;
                  }
                  foreach ([$left, $right] as $index) {
                      $block = $functionBlocks[$index];
                      $relative = str_replace(__DIR__ . '/', '', $block['file']);
                      $key = $relative . ':' . $block['start_line'] . '-' . $block['end_line'];
                      $blockContribution[$key] = ($blockContribution[$key] ?? 0) + 1;
                  }
              }
          }
          arsort($blockContribution);
          echo "TOP_BLOCK_CONTRIBUTORS=" . json_encode(array_slice($blockContribution, 0, 80, true), JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
