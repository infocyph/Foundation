name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  infbyte-module-lifecycle:
    name: Published Infbyte / candidate Foundation lifecycle / PHP ${{ matrix.php }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5", "8.6"]
        mode: [default, no-dev]
    env:
      INSTALL_MODE: ${{ matrix.mode }}
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, pdo_sqlite, fileinfo, mbstring, ctype, sodium, intl, zip
          tools: composer:v2
          coverage: none
      - name: Install published Infbyte with the checked-out Foundation source
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/infbyte-candidate"
          composer create-project --no-install --no-scripts --prefer-dist --no-interaction --no-progress infocyph/infbyte "$project" '^4.0'
          cd "$project"
          # Local path repository is test-only; keep the application's stable constraint.
          composer config repositories.foundation-candidate "$(php -r 'echo json_encode(["type"=>"path","url"=>$argv[1],"options"=>["symlink"=>false,"versions"=>["infocyph/foundation"=>"4.0.1"]]],JSON_THROW_ON_ERROR);' "$GITHUB_WORKSPACE")"
          args=(--no-interaction --prefer-dist --no-progress)
          if [[ "$INSTALL_MODE" == no-dev ]]; then args+=(--no-dev); fi
          unset COMPOSER_NO_DEV
          composer update "${args[@]}"
          cmp "$GITHUB_WORKSPACE/src/Module/ModuleFeatureComposerExecutor.php" vendor/infocyph/foundation/src/Module/ModuleFeatureComposerExecutor.php
          php infbyte app:install
          php -r 'if ((require "config/modules.php")!==["features"=>[]]) exit(1);'
      - name: Preserve installed Composer mode through feature install repair and removal
        shell: bash
        run: |
          set -euo pipefail
          unset COMPOSER_NO_DEV
          cd "$RUNNER_TEMP/infbyte-candidate"
          check_mode() {
            php -r '
              $metadata=json_decode(file_get_contents("vendor/composer/installed.json"),true,flags:JSON_THROW_ON_ERROR);
              if (($metadata["dev"] ?? null)!==($argv[1]==="default")) exit(1);
            ' "$INSTALL_MODE"
            if [[ "$INSTALL_MODE" == no-dev ]]; then
              test ! -d vendor/infocyph/phpforge
              test ! -e vendor/bin/pest
              composer check-platform-reqs --no-dev
            else
              test -d vendor/infocyph/phpforge
              test -f vendor/bin/pest
              composer check-platform-reqs
            fi
          }
          check_mode
          features=(data.database data.filesystem security.crypto security.validation security.mfa security.passkey execution.messaging execution.communication)
          # Repair a not-yet-installed feature through the real Composer path.
          php infbyte module:repair data.database --json=1 > "$RUNNER_TEMP/repair.json"
          php -r '$r=json_decode(file_get_contents($argv[1]),true,flags:JSON_THROW_ON_ERROR); if (($r["status"] ?? null)!=="complete") exit(1);' "$RUNNER_TEMP/repair.json"
          check_mode
          for feature in "${features[@]}"; do
            php infbyte module:install "$feature" --json=1 > "$RUNNER_TEMP/install-$feature.json"
            php -r '$r=json_decode(file_get_contents($argv[1]),true,flags:JSON_THROW_ON_ERROR); if (($r["status"] ?? null)!=="complete") exit(1);' "$RUNNER_TEMP/install-$feature.json"
            check_mode
            php infbyte module:enable "$feature" --json=1
          done
          php -r '$f=array_filter((require "config/modules.php")["features"],static fn($v)=>$v===true); if (count($f)!==8) exit(1);'
          if [[ "$INSTALL_MODE" == default ]]; then composer ic:test:code; fi
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte config:validate --production
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte optimize --json=1 > "$RUNNER_TEMP/infbyte-release.json"
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte app:ready
          php infbyte optimize:clear
          for ((i=${#features[@]}-1; i>=0; i--)); do
            feature="${features[i]}"
            php infbyte module:disable "$feature" --json=1
            php infbyte module:remove "$feature" --json=1 > "$RUNNER_TEMP/remove-$feature.json"
            php -r '$r=json_decode(file_get_contents($argv[1]),true,flags:JSON_THROW_ON_ERROR); if (($r["status"] ?? null)!=="complete") exit(1);' "$RUNNER_TEMP/remove-$feature.json"
            check_mode
          done
          php -r '$f=array_filter((require "config/modules.php")["features"],static fn($v)=>$v===true); if ($f!==[]) exit(1);'
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte config:validate --production
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte optimize --json=1
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte app:ready

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [phpforge, production-consumer, release-evidence, runtime-hosts, talkingbytes-mailpit, talkingbytes-grpc, risk-provider-wire, risk-host-qualification, infbyte-module-lifecycle, redis-cluster, documentation]
    uses: infocyph/phpforge/.github/workflows/release.yml@main
    permissions:
      contents: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
  runtime-hosts:
    name: Native Runwire serving / PHP ${{ matrix.php }} / ${{ matrix.extension }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5", "8.6"]
        extension: [swoole, openswoole]
        exclude:
          # Swoole 6.2.6 cannot compile against PHP 8.6 Zend APIs.
          # PHP 8.6 native serving remains covered by OpenSwoole.
          - php: "8.6"
            extension: swoole
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: "mbstring, intl, sodium, curl, pcntl, posix, sockets, pdo_sqlite, ${{ matrix.extension }}"
          coverage: none
      - name: Install published Foundation dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-stable
      - name: Require the selected real native host runtime
        shell: bash
        env:
          EXPECTED_NATIVE_EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            $extension = getenv("EXPECTED_NATIVE_EXTENSION");
            if (!is_string($extension) || !extension_loaded($extension)) {
              throw new RuntimeException("The selected native extension must be loaded.");
            }
            if (!(new Infocyph\Runwire\Runtime\RuntimeEnvironmentProbe())->probe()->isAvailable(Infocyph\Runwire\Runtime\Enum\RuntimeDriver::SWOOLE)) {
              throw new RuntimeException("Swoole/OpenSwoole is required for native serving acceptance.");
            }
          '
      - name: Verify serving and trusted worker lifecycle on the native runtime
        shell: bash
        run: |
          set -euo pipefail
          cp vendor/infocyph/phpforge/resources/pest.xml .foundation-serving-pest.xml
          trap 'rm -f .foundation-serving-pest.xml' EXIT
          vendor/bin/pest --configuration=.foundation-serving-pest.xml --fail-on-skipped \
            tests/Feature/ServeCommandIntegrationTest.php \
            tests/Feature/WebReleaseRuntimeTest.php

  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_extensions: "mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached"
      fail_on_skipped_tests: true
      integration_services: '["mysql","postgres","sqlite","redis","valkey","memcached"]'
      service_topologies: '{}'
      benchmark_composer_script: "benchmark:release"
      benchmark_result_file: "build/cachelayer-33-utilization.json"


  talkingbytes-mailpit:
    name: Native SMTP / Mailpit - Foundation / TalkingBytes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.6"
          tools: composer:v2
          extensions: "curl, mbstring, intl, sodium, pdo, pdo_sqlite, redis, fileinfo"
          coverage: none
      - name: Install selected published native dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-stable
      - name: Verify real SMTP DATA was accepted and captured by Mailpit
        run: php tests/Fixtures/talkingbytes_mailpit_probe.php

  talkingbytes-grpc:
    name: Native gRPC wire - Foundation / TalkingBytes / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Qualify explicit, non-persistent native channel ownership on every PHP lane.
        php: ["8.4", "8.5", "8.6"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          # Disable runner-preinstalled shared extensions before enabling the test/dependency profile.
          extensions: "none, grpc, curl, mbstring, intl, sodium, pdo, pdo_sqlite, dom, simplexml, xml, xmlreader, xmlwriter, tokenizer, ctype, fileinfo, iconv, phar, openssl, session, sockets, pcntl, posix, zip"
          coverage: none
      - name: Construct a private PHP configuration for native gRPC
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/grpc-php.XXXXXXXX")"
          mkdir "$root/scan"
          module_dir="$(php -r 'echo ini_get("extension_dir");')"
          test -d "$module_dir"
          printf 'extension_dir="%s"\n' "$module_dir" > "$root/php.ini"
          printf 'date.timezone=UTC\nmemory_limit=512M\nopcache.enable=0\nopcache.enable_cli=0\nopcache.jit=disable\nopcache.jit_buffer_size=0\n' >> "$root/php.ini"
          # Load in dependency order, and never load a shared copy of a built-in module.
          for extension in libxml ctype fileinfo iconv openssl phar tokenizer \
            pdo pdo_sqlite dom simplexml xml xmlreader xmlwriter \
            curl mbstring intl sodium session sockets pcntl posix zip grpc; do
            if php -n -r 'exit(extension_loaded($argv[1]) ? 0 : 1);' -- "$extension"; then
              continue
            fi
            test -f "$module_dir/$extension.so"
            printf 'extension=%s.so\n' "$extension" >> "$root/php.ini"
          done
          # An existing empty scan directory prevents fallback to the system conf.d.
          export PHPRC="$root/php.ini"
          export PHP_INI_SCAN_DIR="$root/scan"
          php --ini
          php -m
          php -r '
            if (php_ini_loaded_file() !== getenv("PHPRC") || php_ini_scanned_files() !== false) {
                throw new RuntimeException("Native gRPC must use only its private PHP INI.");
            }
            foreach (["grpc", "curl", "fileinfo", "openssl", "sodium", "mbstring", "pdo", "pdo_sqlite", "dom", "simplexml", "xml", "xmlreader", "xmlwriter", "tokenizer", "phar"] as $extension) {
                if (!extension_loaded($extension)) {
                    throw new RuntimeException("Required private PHP extension unavailable: " . $extension);
                }
            }
          '
          printf 'PHPRC=%s\nPHP_INI_SCAN_DIR=%s\n' "$PHPRC" "$PHP_INI_SCAN_DIR" >> "$GITHUB_ENV"
      - name: Install native gRPC and selected package dependencies
        run: |
          php -r '
            if (php_ini_loaded_file() !== getenv("PHPRC") || php_ini_scanned_files() !== false) {
                throw new RuntimeException("Private PHP INI was not inherited.");
            }
            foreach (["grpc", "curl", "fileinfo", "openssl", "sodium", "mbstring", "pdo", "dom", "xml", "xmlwriter", "tokenizer"] as $extension) {
                if (!extension_loaded($extension)) {
                    throw new RuntimeException("Required PHP extension unavailable: " . $extension);
                }
            }
            foreach (["amqp", "apcu", "ast", "ds", "enchant", "imagick", "imap", "ldap", "memcache", "memcached", "mongodb", "msgpack", "mysqli", "odbc", "pgsql", "redis", "sqlsrv", "swoole", "openswoole", "xdebug", "zmq"] as $extension) {
                if (extension_loaded($extension)) {
                    throw new RuntimeException("Unexpected unrelated PHP extension: " . $extension);
                }
            }
          '
          # PHP 8.5+ can compile OPcache into the binary. It is not a scanned extension.
          if php -n -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);'; then
            echo "Built-in OPcache present; execution and JIT must remain disabled."
          else
            php -r 'if (extension_loaded("Zend OPcache")) { throw new RuntimeException("Unexpected shared OPcache extension."); }'
          fi
          php -r '
            if (extension_loaded("Zend OPcache") && (filter_var(ini_get("opcache.enable"), FILTER_VALIDATE_BOOL)
                || filter_var(ini_get("opcache.enable_cli"), FILTER_VALIDATE_BOOL)
                || (int) ini_get("opcache.jit_buffer_size") !== 0)) {
                throw new RuntimeException("OPcache execution or JIT enabled in native gRPC profile.");
            }
          '
          php --ri grpc
          php --ini
          php -m
          if ! command -v gdb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gdb
          fi
          gdb --version
          composer update --no-interaction --no-progress --prefer-dist --prefer-stable
          composer require --dev "grpc/grpc:^1.76" --no-interaction --no-progress --prefer-dist --prefer-stable
          composer check-platform-reqs
      - name: Verify real native unary transport without spawning from the PHP extension process
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (php_ini_loaded_file() !== getenv("PHPRC") || php_ini_scanned_files() !== false) { throw new RuntimeException("Private PHP INI was not inherited by the wire probe."); }'
          python3 -m venv "$RUNNER_TEMP/foundation-grpc-venv"
          python="$RUNNER_TEMP/foundation-grpc-venv/bin/python"
          "$python" -m pip install --disable-pip-version-check "grpcio>=1.76,<2"
          root="$(mktemp -d "$RUNNER_TEMP/foundation-grpc.XXXXXXXX")"
          "$python" tests/Fixtures/talkingbytes_grpc_server.py "$root/ready.json" > "$root/server.log" 2>&1 &
          peer=$!
          cleanup() {
            if kill -0 "$peer" 2>/dev/null; then
              kill "$peer"
            fi
            # The peer intentionally receives SIGTERM; do not replace the client exit status.
            wait "$peer" 2>/dev/null || :
            rm -rf -- "$root"
          }
          trap cleanup EXIT
          for ((attempt = 0; attempt < 100; ++attempt)); do
            if [[ -f "$root/ready.json" ]]; then
              break
            fi
            if ! kill -0 "$peer" 2>/dev/null; then
              cat "$root/server.log" >&2
              exit 1
            fi
            sleep 0.1
          done
          if [[ ! -f "$root/ready.json" ]]; then
            cat "$root/server.log" >&2
            echo "Native gRPC peer did not become ready." >&2
            exit 1
          fi
          export GRPC_TEST_PORT
          GRPC_TEST_PORT="$("$python" -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["port"])' "$root/ready.json")"
          # Isolate the native extension from all Composer packages and other extensions.
          # Use the same real peer, deadline, unary wire data and strict exit status.
          grpc_module="$(php -r 'echo ini_get("extension_dir");')/grpc.so"
          test -f "$grpc_module"
          native_php='
            $port = filter_var(getenv("GRPC_TEST_PORT"), FILTER_VALIDATE_INT, ["options" => ["min_range" => 1, "max_range" => 65535]]);
            if (!is_int($port)) {
                throw new RuntimeException("Invalid native control port.");
            }
            $channel = new Grpc\Channel("127.0.0.1:" . $port, [
                "credentials" => Grpc\ChannelCredentials::createInsecure(),
                "force_new" => true,
            ]);
            try {
                $deadline = Grpc\Timeval::now()->add(new Grpc\Timeval(3000000));
                $call = new Grpc\Call($channel, "/foundation.Integration/Unary", $deadline);
                $call->startBatch([
                    Grpc\OP_SEND_INITIAL_METADATA => [],
                    Grpc\OP_SEND_MESSAGE => ["message" => "extension-only"],
                    Grpc\OP_SEND_CLOSE_FROM_CLIENT => true,
                ]);
                $event = $call->startBatch([
                    Grpc\OP_RECV_INITIAL_METADATA => true,
                    Grpc\OP_RECV_MESSAGE => true,
                    Grpc\OP_RECV_STATUS_ON_CLIENT => true,
                ]);
                if ($event->status->code !== 0 || $event->message !== "echo:extension-only") {
                    throw new RuntimeException("Extension-only native roundtrip failed.");
                }
                unset($event, $call, $deadline);
            } finally {
                $channel->close();
                unset($channel);
            }
            echo "Extension-only native gRPC roundtrip and close verified.\n";
          '
          php -n -d "extension=$grpc_module" -r "$native_php"
          # BaseStub initializes process-global default roots even for this insecure loopback.
          # The fixture closes its own channel and invalidates only roots that it initialized.
          # Keep normal PHP configuration and strict exit status; collect a backtrace if it crashes.
          standalone_php='
            require "vendor/autoload.php";
            $port = filter_var(getenv("GRPC_TEST_PORT"), FILTER_VALIDATE_INT, ["options" => ["min_range" => 1, "max_range" => 65535]]);
            if (!is_int($port)) {
                throw new RuntimeException("Invalid native peer port.");
            }
            $stub = new Infocyph\Foundation\Tests\Fixtures\FoundationGrpcFixtureStub($port);
            try {
                $result = $stub->call("Unary", new Infocyph\Foundation\Tests\Fixtures\FoundationGrpcFixtureMessage("standalone"), 3.0);
                if ($result->statusCode !== 0 || !$result->message instanceof Infocyph\Foundation\Tests\Fixtures\FoundationGrpcFixtureMessage || $result->message->payload !== "echo:standalone") {
                    throw new RuntimeException("Standalone native gRPC roundtrip failed.");
                }
            } finally {
                $stub->close();
            }
            unset($result, $stub);
            echo "Standalone native gRPC roundtrip and close verified.\n";
          '
          # Enable process-local core dumps; never alter host-wide kernel settings.
          ulimit -c unlimited
          printf 'Core pattern: '
          cat /proc/sys/kernel/core_pattern
          run_native_probe() {
            local status pid core
            php "$@" &
            pid=$!
            if wait "$pid"; then
              return 0
            else
              status=$?
            fi
            if [[ "$status" -eq 139 ]]; then
              echo "::group::Native gRPC shutdown backtrace"
              # Inspect the original crash before attempting a timing-sensitive replay.
              for core in "core.$pid" core; do
                if [[ -f "$core" ]]; then
                  timeout 90s gdb --batch -ex "set pagination off" \
                    -ex "thread apply all bt" "$(command -v php)" "$core" || :
                  rm -f -- "$core"
                  echo "::endgroup::"
                  return "$status"
                fi
              done
              if command -v coredumpctl >/dev/null; then
                if coredumpctl --no-pager dump "$pid" --output="$root/native.core"; then
                  timeout 90s gdb --batch -ex "set pagination off" \
                    -ex "thread apply all bt" "$(command -v php)" "$root/native.core" || :
                  rm -f -- "$root/native.core"
                  echo "::endgroup::"
                  return "$status"
                fi
              fi
              # The runner may route cores to an inaccessible crash service.
              # A diagnostic replay never replaces the original failed exit.
              timeout 90s gdb --batch --return-child-result \
                -ex "set pagination off" \
                -ex "set disable-randomization off" \
                -ex run -ex "thread apply all bt" \
                --args "$(command -v php)" "$@" || :
              echo "::endgroup::"
            fi
            return "$status"
          }
          # Same extension calls under the configured minimal INI, without Composer.
          run_native_probe -r "$native_php"
          run_native_probe -r "$standalone_php"
          run_native_probe tests/Fixtures/talkingbytes_grpc_probe.php

  risk-provider-wire:
    name: Native risk challenge provider / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5", "8.6"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: "curl, mbstring, intl, sodium, pdo_sqlite, sockets, openssl, fileinfo"
          coverage: none
      - name: Install released provider dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-stable
      - name: Verify strict native TLS in a disposable network namespace
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/risk-provider.XXXXXXXX")"
          trap 'rm -rf -- "$root"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=Risk fixture CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -keyout "$root/ca.key" -out "$root/ca.pem"
          openssl req -new -newkey rsa:2048 -nodes -subj '/CN=verify.example.test' \
            -keyout "$root/leaf.key" -out "$root/leaf.csr"
          printf 'subjectAltName=DNS:verify.example.test\nextendedKeyUsage=serverAuth\n' > "$root/leaf.ext"
          openssl x509 -req -days 1 -in "$root/leaf.csr" -CA "$root/ca.pem" -CAkey "$root/ca.key" \
            -CAcreateserial -extfile "$root/leaf.ext" -out "$root/leaf.pem"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=Unrelated fixture CA' \
            -keyout "$root/untrusted.key" -out "$root/untrusted.pem"
          # Namespace-local network state only; no host interfaces or production policy changes.
          sudo unshare --net -- bash tests/Fixtures/risk_provider_qualification.sh "$root"


  risk-host-qualification:
    name: Isolated risk login host and sustained soak / PHP 8.6
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.6"
          tools: composer:v2
          extensions: "curl, mbstring, intl, sodium, pdo, pdo_sqlite, redis, sockets, pcntl, posix"
          coverage: none
      - name: Install real authentication and ordinary hosts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nginx caddy redis-server redis-tools python3-venv
          version="$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')"
          if ! command -v "php-fpm$version" >/dev/null; then
            sudo apt-get install -y -qq --no-install-recommends "php$version-fpm"
          fi
          "$(command -v "php-fpm$version")" -v
          php -v
          composer update --no-interaction --no-progress --prefer-dist --prefer-stable
      - name: Qualify isolated authentication worker lifecycle and sustained traffic
        run: bash tests/Fixtures/risk_host_qualification.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: foundation-risk-host-qualification
          path: build/risk-host-qualification/
          if-no-files-found: warn


  redis-cluster:
    name: Native Redis Cluster - Foundation / CacheLayer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.6"
          tools: composer:v2
          extensions: "redis, mbstring, intl, sodium, pdo, pdo_sqlite"
          coverage: none
      - name: Install real Redis Cluster runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server redis-tools
      - name: Start independent Redis Cluster slots
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/foundation-redis-cluster"
          mkdir -p "$root"
          for port in 7200 7201 7202; do
            mkdir -p "$root/$port"
            redis-server --port "$port" --bind 127.0.0.1 --protected-mode no \
              --cluster-enabled yes --cluster-config-file "nodes-$port.conf" \
              --cluster-node-timeout 5000 --appendonly no --save '' \
              --daemonize yes --dir "$root/$port"
          done
          redis-cli --cluster create 127.0.0.1:7200 127.0.0.1:7201 127.0.0.1:7202 \
            --cluster-replicas 0 --cluster-yes
          for attempt in $(seq 1 30); do
            if redis-cli -p 7200 cluster info | grep -q 'cluster_state:ok'; then
              exit 0
            fi
            sleep 1
          done
          echo "Real Redis Cluster never reached a healthy slot state." >&2
          exit 1
      - name: Verify multi-slot, atomic and invalidation boundaries through Foundation
        env:
          FOUNDATION_REDIS_CLUSTER_SEEDS: "127.0.0.1:7200,127.0.0.1:7201,127.0.0.1:7202"
        run: |
          composer update --no-interaction --no-progress --prefer-dist --prefer-stable
          php benchmarks/foundation4-redis-cluster-smoke.php
      - name: Stop Redis Cluster
        if: always()
        run: |
          for port in 7200 7201 7202; do
            redis-cli -p "$port" shutdown nosave || true
          done

  production-consumer:
    name: Production consumer - PHP ${{ matrix.php-version }} - ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5", "8.6"]
        dependencies: ["prefer-stable", "prefer-lowest"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: "mbstring, intl, sodium, fileinfo, zip, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, memcached"
          coverage: none
      - name: Verify isolated production consumers
        shell: bash
        run: |
          set -euo pipefail

          composer_args=(--no-dev --no-interaction --prefer-dist --no-progress)
          if [ "${{ matrix.dependencies }}" = "prefer-lowest" ]; then
            composer_args+=(--prefer-lowest)
          fi

          minimal="$RUNNER_TEMP/foundation-minimal-consumer"
          optional="$RUNNER_TEMP/foundation-optional-consumer"
          mkdir -p "$minimal/storage" "$optional/storage"

          cat > "$minimal/composer.json" <<JSON
          {
            "name": "infocyph/foundation-minimal-consumer",
            "type": "project",
            "minimum-stability": "dev",
            "prefer-stable": true,
            "repositories": [
              {
                "type": "path",
                "url": "$GITHUB_WORKSPACE",
                "options": {"symlink": false}
              }
            ],
            "require": {
              "infocyph/foundation": "*"
            }
          }
          JSON

          (
            cd "$minimal"
            composer update "${composer_args[@]}"
            vendor/bin/infbyte list > command-list.txt
            php "$GITHUB_WORKSPACE/tests/Fixtures/ModuleFeatureProductionMatrix.php" core
            php -r 'require "vendor/autoload.php";'
            if composer show infocyph/phpforge >/dev/null 2>&1; then
              echo "PHPForge leaked into the production consumer." >&2
              exit 1
            fi
            for package in infocyph/dblayer infocyph/epicrypt infocyph/omnibus infocyph/otp infocyph/pathwise infocyph/reqshield infocyph/talkingbytes web-auth/webauthn-lib; do
              if composer show "$package" >/dev/null 2>&1; then
                echo "Optional package $package leaked into the minimal consumer." >&2
                exit 1
              fi
            done
          )

          cat > "$optional/composer.json" <<JSON
          {
            "name": "infocyph/foundation-optional-consumer",
            "type": "project",
            "minimum-stability": "dev",
            "prefer-stable": true,
            "repositories": [
              {
                "type": "path",
                "url": "$GITHUB_WORKSPACE",
                "options": {"symlink": false}
              }
            ],
            "require": {
              "infocyph/foundation": "*",
              "infocyph/dblayer": "^6.1.4"
            }
          }
          JSON

          (
            cd "$optional"
            composer update "${composer_args[@]}"
            vendor/bin/infbyte list > command-list.txt
            vendor/bin/infbyte module:show data.database --json > database-module.json
            php /dev/stdin <<'PHP'
          <?php
              $payload = json_decode(file_get_contents("database-module.json"), true, 512, JSON_THROW_ON_ERROR);
              if (($payload["schema_version"] ?? null) !== 2
                  || ($payload["module"] ?? null) !== "data"
                  || !isset($payload["states"]["data.database"])) {
                  fwrite(STDERR, "Database module inspection did not return the expected payload.\n");
                  exit(1);
              }
          PHP
            if composer show infocyph/phpforge >/dev/null 2>&1; then
              echo "PHPForge leaked into the optional production consumer." >&2
              exit 1
            fi
          )

          # Exercise the full published specialist set under production --no-dev.
          # Availability of a library does not implicitly enable a capability.
          full="$RUNNER_TEMP/foundation-full-consumer"
          mkdir -p "$full/storage"
          cat > "$full/composer.json" <<JSON
          {
            "name": "infocyph/foundation-full-consumer",
            "type": "project",
            "minimum-stability": "dev",
            "prefer-stable": true,
            "repositories": [
              {"type": "path", "url": "$GITHUB_WORKSPACE", "options": {"symlink": false}}
            ],
            "require": {
              "infocyph/foundation": "*",
              "infocyph/dblayer": "^6.1.4",
              "infocyph/epicrypt": "^3.3",
              "infocyph/omnibus": "^3.0.3",
              "infocyph/otp": "^7.0.1",
              "infocyph/pathwise": "^4.2.1",
              "infocyph/reqshield": "^3.3.1",
              "infocyph/talkingbytes": "^2.3.1",
              "web-auth/webauthn-lib": "^5.3.12"
            }
          }
          JSON
          (
            cd "$full"
            composer update "${composer_args[@]}"
            vendor/bin/infbyte list > commands.txt
            vendor/bin/infbyte module:list --json > modules.json
            php /dev/stdin <<'PHP'
          <?php
              $payload = json_decode(file_get_contents("modules.json"), true, 512, JSON_THROW_ON_ERROR);
              if (($payload["schema_version"] ?? null) !== 2
                  || array_column($payload["modules"] ?? [], "name") !== ["data", "security", "execution"]
                  || count(array_merge(...array_column($payload["modules"] ?? [], "features"))) !== 8) {
                  fwrite(STDERR, "Unexpected Foundation 4 three-module/eight-feature v2 catalog.\n");
                  exit(1);
              }
          PHP
            php /dev/stdin <<'PHP'
          <?php
              require "vendor/autoload.php";
              foreach ([
                  \Infocyph\Runwire\RuntimeContext::class,
                  \Infocyph\DBLayer\Connection\Connection::class,
                  \Infocyph\Omnibus\Envelope\Envelope::class,
                  \Infocyph\TalkingBytes\Http\HttpClient::class,
              ] as $class) {
                  if (!class_exists($class)) {
                      fwrite(STDERR, "Missing selected owner: " . $class . "\n");
                      exit(1);
                  }
              }
              $app = \Infocyph\Foundation\Foundation::worker([
                  "app" => ["base_path" => getcwd(), "env" => "local", "capabilities" => []],
                  "_config_cache" => false,
              ])->boot();
              $runtime = \Infocyph\Runwire\RuntimeContext::standalone();
              $request = \Infocyph\Runwire\RequestContext::create($runtime);
              try {
                  $app->execution()->run(
                      static function () use ($app, $runtime, $request): void {
                          if ($app->make(\Infocyph\Runwire\RuntimeContext::class) !== $runtime
                              || $app->make(\Infocyph\Runwire\RequestContext::class) !== $request
                          ) {
                              throw new \LogicException("Runwire host input identity changed.");
                          }
                      },
                      [
                          \Infocyph\Runwire\RuntimeContext::class => $runtime,
                          \Infocyph\Runwire\RequestContext::class => $request,
                      ],
                  );
              } finally {
                  $request->complete();
              }
          PHP
            php "$GITHUB_WORKSPACE/docs/examples/foundation-4-compiled-release.php"
            php "$GITHUB_WORKSPACE/tests/Fixtures/ModuleFeatureProductionMatrix.php" all
            if composer show infocyph/phpforge >/dev/null 2>&1; then
              echo "PHPForge leaked into full production consumer." >&2
              exit 1
            fi
          )


  release-evidence:
    name: Release evidence
    needs: [phpforge, production-consumer]
    if: ${{ always() && needs.phpforge.result == 'success' && needs.production-consumer.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.6"
          tools: composer:v2
          extensions: "mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached"
          coverage: none
      - name: Install release-evidence dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Diagnose Foundation 4 release tooling and active configuration
        run: |
          composer ic:doctor
          composer ic:list-config
          composer ic:active-config
      - name: Complete PHPForge release-guard constraints
        run: |
          composer validate --strict
          composer ic:release:constraints
          composer ic:release:audit
      - name: Verify actual PHP platform and locked Composer advisory policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          composer check-platform-reqs --lock --format=json > build/release-evidence/platform-full.json
          composer check-platform-reqs --lock --no-dev --format=json > build/release-evidence/platform-core.json
          composer audit --locked --abandoned=report --format=json > build/release-evidence/composer-audit.json
      - name: Execute migration bootstrap smoke examples
        run: |
          php docs/examples/foundation-4-core.php
          php docs/examples/foundation-4-runwire-worker.php
      - name: Capture release evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASELINE_SOURCE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          directory=build/release-evidence
          mkdir -p "$directory"
          {
            printf "source_sha=%s\n" "$SOURCE_SHA"
            printf "ci_sha=%s\n" "$GITHUB_SHA"
            printf "php=%s\n" "$(php -r 'echo PHP_VERSION;')"
            printf "phpforge_workflow=%s\n" "infocyph/phpforge/.github/workflows/security-standards.yml@main"
            printf "generated_at=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$directory/manifest.env"
          php -m | sort > "$directory/php-extensions.txt"
          composer show --locked --format=json > "$directory/dependencies.json"
          composer show --locked --direct --format=json > "$directory/dependencies-direct.json"
          sha256sum composer.lock > "$directory/composer-lock.sha256"
          cp composer.json "$directory/candidate-composer.json"
          if [[ -n "$BASELINE_SOURCE_SHA" ]]; then
            [[ "$BASELINE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid pull request baseline SHA." >&2; exit 1; }
            git fetch --no-tags --depth=1 origin "$BASELINE_SOURCE_SHA"
            test "$(git rev-parse "$BASELINE_SOURCE_SHA^{commit}")" = "$BASELINE_SOURCE_SHA"
            printf 'baseline_source_sha=%s\n' "$BASELINE_SOURCE_SHA" > "$directory/pre-upgrade-source.env"
            git show "$BASELINE_SOURCE_SHA:composer.json" > "$directory/pre-upgrade-composer.json"
            if git cat-file -e "$BASELINE_SOURCE_SHA:composer.lock" 2>/dev/null; then
              git show "$BASELINE_SOURCE_SHA:composer.lock" > "$directory/pre-upgrade-composer.lock"
              sha256sum "$directory/pre-upgrade-composer.lock" > "$directory/pre-upgrade-composer-lock.sha256"
              printf 'baseline_lock=tracked\n' >> "$directory/pre-upgrade-source.env"
            else
              printf 'baseline_lock=not_tracked_in_source\n' >> "$directory/pre-upgrade-source.env"
            fi
          else
            printf 'baseline_source_sha=not_a_pull_request\n' > "$directory/pre-upgrade-source.env"
          fi
          php --ini=diff > "$directory/php-ini-diff.txt"
          git ls-files 'tests/*.php' 'tests/**/*.php' | sort > "$directory/test-files.txt"
          awk 'NF { count++ } END { printf "test_file_inventory=%d\n", count }' "$directory/test-files.txt" > "$directory/test-inventory.env"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: foundation-release-evidence-${{ github.sha }}
          path: build/release-evidence/
          retention-days: 30

  documentation:
    name: Infbyte documentation / Sphinx
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Build Infbyte HTML with strict references and warnings
        run: python -m sphinx -b html -n -W --keep-going docs docs/_build/html
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.6"
          coverage: none
      - name: Syntax-check documented command, schedule and provider examples
        shell: bash
        run: |
          set -euo pipefail
          php -l docs/examples/infbyte-clock-provider.php.txt
          php -l docs/examples/infbyte-report-command.php.txt
          php -l docs/examples/infbyte-schedule.php.txt
      - name: Audit documented public API, features and configuration
        run: python docs/tools/check_public_contracts.py
      - name: Syntax-check complete PHP examples in RST
        run: python docs/tools/lint_php_blocks.py
