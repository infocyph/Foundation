name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@fdec64cf4460f13116eb0e2f3405acadd3e84377
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_versions: '["8.4","8.5"]'
      php_extensions: "mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached"
      fail_on_skipped_tests: true
      integration_services: '["mysql","postgres","sqlite","redis","valkey","memcached"]'
      service_topologies: '{}'
      benchmark_composer_script: "benchmark:release"
      benchmark_result_file: "build/cachelayer-33-utilization.json"


  production-consumer:
    name: Production consumer - PHP ${{ matrix.php-version }} - ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
        dependencies: ["prefer-stable", "prefer-lowest"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: "mbstring, pdo, pdo_sqlite"
          coverage: none
      - name: Verify isolated production consumers
        shell: bash
        run: |
          set -euo pipefail

          composer_args=(--no-dev --no-interaction --prefer-dist --no-progress)
          if [ "${{ matrix.dependencies }}" = "prefer-lowest" ]; then
            composer_args+=(--prefer-lowest)
          fi

          minimal="$RUNNER_TEMP/foundation-minimal-consumer"
          optional="$RUNNER_TEMP/foundation-optional-consumer"
          mkdir -p "$minimal/storage" "$optional/storage"

          cat > "$minimal/composer.json" <<JSON
          {
            "name": "infocyph/foundation-minimal-consumer",
            "type": "project",
            "minimum-stability": "dev",
            "prefer-stable": true,
            "repositories": [
              {
                "type": "path",
                "url": "$GITHUB_WORKSPACE",
                "options": {"symlink": false}
              }
            ],
            "require": {
              "infocyph/foundation": "*"
            }
          }
          JSON

          (
            cd "$minimal"
            composer update "${composer_args[@]}"
            vendor/bin/infbyte list > command-list.txt
            php -r 'require "vendor/autoload.php";'
            if composer show infocyph/phpforge >/dev/null 2>&1; then
              echo "PHPForge leaked into the production consumer." >&2
              exit 1
            fi
            for package in infocyph/dblayer infocyph/epicrypt infocyph/omnibus infocyph/otp infocyph/pathwise infocyph/reqshield infocyph/talkingbytes web-auth/webauthn-lib; do
              if composer show "$package" >/dev/null 2>&1; then
                echo "Optional package $package leaked into the minimal consumer." >&2
                exit 1
              fi
            done
          )

          cat > "$optional/composer.json" <<JSON
          {
            "name": "infocyph/foundation-optional-consumer",
            "type": "project",
            "minimum-stability": "dev",
            "prefer-stable": true,
            "repositories": [
              {
                "type": "path",
                "url": "$GITHUB_WORKSPACE",
                "options": {"symlink": false}
              }
            ],
            "require": {
              "infocyph/foundation": "*",
              "infocyph/dblayer": "^5.1"
            }
          }
          JSON

          (
            cd "$optional"
            composer update "${composer_args[@]}"
            vendor/bin/infbyte list > command-list.txt
            vendor/bin/infbyte module:show database --json > database-module.json
            php -r '
              $payload = json_decode(file_get_contents("database-module.json"), true, 512, JSON_THROW_ON_ERROR);
              if (($payload["name"] ?? null) !== "database") {
                  fwrite(STDERR, "Database module inspection did not return the expected payload.\n");
                  exit(1);
              }
            '
            if composer show infocyph/phpforge >/dev/null 2>&1; then
              echo "PHPForge leaked into the optional production consumer." >&2
              exit 1
            fi
          )

  infbyte-consumer:
    name: Infbyte candidate consumer - PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: "pcntl, pdo_sqlite"
          coverage: none

      - name: Checkout Infbyte consumer
        uses: actions/checkout@v7
        with:
          repository: infocyph/Infbyte
          ref: main
          path: .infbyte-consumer

      - name: Verify Infbyte against the Foundation candidate
        shell: bash
        run: |
          set -euo pipefail

          foundation="$GITHUB_WORKSPACE"
          consumer="$GITHUB_WORKSPACE/.infbyte-consumer"

          php -r '
            $path = $argv[1] . "/composer.json";
            $composer = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
            $composer["version"] = "3.0.99";
            file_put_contents(
                $path,
                json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL,
            );
          ' "$foundation"

          cd "$consumer"
          php -r '
            $path = "composer.json";
            $composer = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
            $repositories = is_array($composer["repositories"] ?? null)
                ? $composer["repositories"]
                : [];
            array_unshift($repositories, [
                "type" => "path",
                "url" => $argv[1],
                "options" => ["symlink" => false],
            ]);
            $composer["repositories"] = $repositories;
            file_put_contents(
                $path,
                json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL,
            );
          ' "$foundation"

          composer update --no-dev --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs

          foundation_version="$(php -r 'require "vendor/autoload.php"; echo Composer\InstalledVersions::getPrettyVersion("infocyph/foundation") ?? "";')"
          if [[ "$foundation_version" != "3.0.99" ]]; then
            printf 'Expected candidate Foundation 3.0.99 path package, got %s\n' "$foundation_version" >&2
            exit 1
          fi

          candidate_hash="$(sha256sum "$foundation/src/Foundation.php" | awk '{print $1}')"
          installed_hash="$(sha256sum vendor/infocyph/foundation/src/Foundation.php | awk '{print $1}')"
          if [[ "$candidate_hash" != "$installed_hash" ]]; then
            echo "Infbyte did not install the current Foundation candidate source." >&2
            exit 1
          fi

          php infbyte app:install
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte config:validate --production
          release="$(APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte optimize --json=1)"
          APP_ENV=production APP_DEBUG=false APP_CAPABILITIES= php infbyte app:ready

          printf '%s' "$release" | php -r '
            $release = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
            if (!is_string($release["generation"] ?? null) || $release["generation"] === "") {
                fwrite(STDERR, "Infbyte candidate release generation is missing.\n");
                exit(1);
            }
            if (!is_string($release["manifest_sha256"] ?? null)
                || preg_match("/^[a-f0-9]{64}$/D", $release["manifest_sha256"]) !== 1
            ) {
                fwrite(STDERR, "Infbyte candidate manifest digest is invalid.\n");
                exit(1);
            }
          '

  release-evidence:
    name: Release evidence
    needs: [phpforge, production-consumer, infbyte-consumer]
    if: ${{ always() && needs.phpforge.result == 'success' && needs.production-consumer.result == 'success' && needs.infbyte-consumer.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: "mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached"
          coverage: none
      - name: Install release-evidence dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Complete PHPForge release-guard constraints
        run: |
          composer validate --strict
          composer ic:release:constraints
      - name: Capture release evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          directory=build/release-evidence
          mkdir -p "$directory"
          {
            printf "source_sha=%s\n" "$SOURCE_SHA"
            printf "ci_sha=%s\n" "$GITHUB_SHA"
            printf "php=%s\n" "$(php -r 'echo PHP_VERSION;')"
            printf "phpforge_workflow=%s\n" "fdec64cf4460f13116eb0e2f3405acadd3e84377"
            printf "generated_at=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$directory/manifest.env"
          php -m | sort > "$directory/php-extensions.txt"
          composer show --locked --format=json > "$directory/dependencies.json"
          git ls-files 'tests/*.php' 'tests/**/*.php' | sort > "$directory/test-files.txt"
          awk 'NF { count++ } END { printf "test_file_inventory=%d\n", count }' "$directory/test-files.txt" > "$directory/test-inventory.env"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: foundation-release-evidence-${{ github.sha }}
          path: build/release-evidence/
          retention-days: 30
