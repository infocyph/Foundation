name: Normalize Consolidated Foundation Runtime Plan

on:
  push:
    branches:
      - foundation-3/runwire-launch-plan

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation-3/runwire-launch-plan
      - name: Normalize canonical plan
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/plans/foundation-3-final-runtime-development-plan.md')
          text = path.read_text()

          text = text.replace('**Active branch:** `foundation-3/close-26.6`', '**Active branch:** `foundation-3/runwire-launch-plan`')

          text = text.replace(
              'Foundation has four runtime paths: `web`, `cli`, `worker`, and `scheduler`. They share one composition source, while every independently active runtime uses a fresh InterMix builder/generated artifact. Webrick remains the sole web HTTP runtime/output owner.',
              'Foundation has four application runtime paths: `web`, `cli`, `worker`, and `scheduler`. They share one composition source, while every independently active application runtime uses a fresh InterMix builder/generated artifact. Webrick remains the sole HTTP application-semantics/request/response owner; Runwire may own the underlying server/process/network transport according to the selected runtime driver.'
          )
          text = text.replace(
              '- **Webrick:** HTTP route/runtime/request/middleware/response mechanics.',
              '- **Webrick:** HTTP application route/runtime/request/middleware/response mechanics.'
          )

          # Final lower-library targets for Foundation 3.
          text = text.replace('| 26.5 | Pathwise | `^4.0` | implementation complete; normal-package/final QA acceptance **in progress** |', '| 26.5 | Pathwise | `^4.1` | 4.0 integration complete; 4.1 runtime-security hardening **planned** |')
          text = text.replace('| 26.7 | ReqShield | `^3.1` | open/deferred |', '| 26.7 | ReqShield | `^3.2` | open/deferred |')
          text = text.replace('| 26.8 | Omnibus | `^2.5` | open/deferred |', '| 26.8 | Omnibus | `^2.6` | open/deferred |')

          text = text.replace('## 26.5 Pathwise 4 filesystem integration — implementation complete; acceptance in progress', '## 26.5 Pathwise 4.1 filesystem/runtime-security integration — 4.0 integration complete; 4.1 hardening planned')
          text = text.replace('- [X] Foundation Composer floor is `^4.0`.', '- [X] Foundation integration baseline is Pathwise `^4.0`; final Foundation 3 target is `^4.1` after runtime-security hardening.')
          if '- [ ] Consume released Pathwise `^4.1`' not in text:
              needle = '### Remaining acceptance\n\n'
              replacement = '### Remaining acceptance\n\n- [ ] Consume released Pathwise `^4.1` and close the strict untrusted-data/Runwire filesystem-boundary acceptance before Foundation 3 final release.\n'
              # Only modify the first Remaining acceptance after the Pathwise heading.
              idx = text.find('## 26.5 Pathwise 4.1')
              if idx != -1:
                  pos = text.find(needle, idx)
                  if pos != -1:
                      text = text[:pos] + replacement + text[pos + len(needle):]
          text = text.replace('released Epicrypt 3 + OTP 6.1 + Pathwise 4 resolution', 'released Epicrypt 3 + OTP 6.1 + Pathwise 4.1 resolution')
          text = text.replace('**Status:** implementation/dependency closure complete; final exact-head QA/performance acceptance open.', '**Status:** Pathwise 4.0 integration/dependency closure complete; Pathwise 4.1 runtime-security hardening and final acceptance remain open.')

          text = text.replace('## 26.7 ReqShield 3.1 utilization — open/deferred', '## 26.7 ReqShield 3.2 utilization — open/deferred')
          text = text.replace('Rescan Foundation ReqShield usage against 3.1', 'Rescan Foundation ReqShield usage against 3.2')

          text = text.replace('## 26.8 Omnibus 2.5 utilization — open/deferred', '## 26.8 Omnibus 2.6 utilization — open/deferred')
          text = text.replace('Rescan Foundation Omnibus 2.5 usage', 'Rescan Foundation Omnibus 2.6 usage')
          text = text.replace('- [ ] Keep durable DB/cache integrations lazy and selected explicitly.', '- [ ] Construct durable DB/cache integrations explicitly after fork in the child; preserve exact child-owned connection/resource semantics where required.')
          text = text.replace('- [ ] Bind after-commit behavior to the current execution connection; never capture scoped connections in singletons.', '- [ ] Bind after-commit behavior to the exact transaction-owning child connection; never inherit/open durable DB/cache/broker resources in the Runwire parent before fork.')

          # Correct cross-library execution order: Runwire precedes final Omnibus 2.6 process integration.
          old_order = '''6. Return to 26.7 ReqShield → 26.8 Omnibus → 26.9 TalkingBytes.
7. Execute 26.12 Runwire 1.0 native/runtime-driver integration and close its launch acceptance.
8. Run aggregate Phase 10 / Foundation release-readiness gates.'''
          new_order = '''6. Return to 26.7 ReqShield 3.2 and 26.9 TalkingBytes 2.0 while Runwire core can proceed in parallel.
7. Execute 26.12 Runwire 1.0 + Webrick native adapter/runtime-driver integration and close the Runwire launch acceptance.
8. Close 26.8 Omnibus 2.6 against released Runwire 1.0, removing duplicate raw process supervision.
9. Run aggregate Phase 10 / Foundation release-readiness gates.'''
          text = text.replace(old_order, new_order)

          # Remove stale addendum/proposal wording now that all Runwire material is canonical here.
          text = text.replace('### 30. Proposed canonical tracker update', '### 30. Canonical tracker and ownership synchronization')
          text = text.replace('When this addendum is reconciled into the canonical Foundation plan, add:', 'The canonical tracker includes:')
          text = text.replace('| 26.12 | Runwire | ^1.0 | open / launch dependency |', '| 26.12 | Runwire native process/server runtime | ^1.0 | planned / Foundation 3 launch requirement |')
          text = text.replace('Update the lower-library ownership list with:', 'The lower-library ownership list recognizes:')
          text = text.replace('Update the Foundation invariant so it also prohibits a second generic process/server runtime above Runwire.', 'The Foundation invariant prohibits a second generic process/server runtime above Runwire.')
          text = text.replace('Update the current execution order so Point 27/Phase 10 runs only after **26.12** is closed.', 'The current execution order keeps Point 27/Phase 10 blocked until **26.12** is closed.')

          pattern = re.compile(
              r'### Integrated runtime selection and OPcache requirements\n\n'
              r'### Foundation 3 — Runwire Runtime Selection Addendum\n\n'
              r'\*\*Status:\*\* normative addendum to `foundation-3-runwire-native-runtime-launch-plan\.md`  \n'
              r'\*\*Branch:\*\* `foundation-3/runwire-launch-plan`  \n'
              r'\*\*Runwire target:\*\* 1\.0\n\n'
          )
          text = pattern.sub('### 35. Runtime drivers and OPcache selection\n\n', text)
          text = text.replace(
              'This addendum must be reconciled into the canonical Foundation runtime plan before Foundation 3 release.',
              'These runtime-selection requirements are part of Point 26.12 and must pass before Foundation 3 release.'
          )

          # The canonical release gate already includes Runwire.
          text = text.replace('### 32. Aggregate release gate change', '### 32. Aggregate release gate')

          path.write_text(text)
          Path('.github/workflows/normalize-consolidated-runwire-plan.yml').unlink()
          PY
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: normalize canonical Foundation Runwire plan"
          git push origin HEAD:foundation-3/runwire-launch-plan
