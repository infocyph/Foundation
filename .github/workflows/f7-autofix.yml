name: "F7 Autofix"

on:
  push:
    branches: [ "feature/oauth-2.1" ]
    paths: [ ".github/workflows/f7-autofix.yml" ]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/oauth-2.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Apply PHPForge Pint rules
        run: vendor/bin/pint --config vendor/infocyph/phpforge/resources/pint.json
      - name: Apply PHPForge Rector rules
        run: vendor/bin/rector process --config vendor/infocyph/phpforge/resources/rector.php
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks src tests
          if git diff --cached --quiet; then
            echo "No generated fixes"
            exit 0
          fi
          git commit -m "style(f7): apply PHPForge formatter and rector"
          git push origin HEAD:feature/oauth-2.1
