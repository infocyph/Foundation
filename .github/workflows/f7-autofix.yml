name: F7 Correctness Fix

on:
  push:
    branches:
      - feature/oauth-2.1
    paths:
      - .github/workflows/f7-autofix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/oauth-2.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Apply deterministic correctness patch
        run: python tools/f7-correctness-fix.py
      - name: Apply PHPForge style and refactor rules
        run: |
          vendor/bin/pint --config vendor/infocyph/phpforge/resources/pint.json
          vendor/bin/rector process --config vendor/infocyph/phpforge/resources/rector.php
      - name: Commit correctness fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests benchmarks
          git commit --no-verify -m "fix(f7): close release correctness failures"
          git push origin HEAD:feature/oauth-2.1
