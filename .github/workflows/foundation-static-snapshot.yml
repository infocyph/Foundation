name: Foundation static snapshot

on:
  push:
    branches: [feature/foundation-2.0]
    paths: [.github/workflows/foundation-static-snapshot.yml]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foundation-2.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer ic:test:static
