name: Foundation Process Temp

on:
  push:
    branches:
      - feature/foundation-2.0
    paths:
      - '.github/workflows/foundation-process-temp.yml'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/foundation-2.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress
      - name: Run PHPForge process
        id: process
        continue-on-error: true
        run: composer ic:process
      - name: Commit processed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No fixer changes to commit."
            exit 0
          fi
          git commit -m "Apply PHPForge process fixes [skip ci]"
          git push origin HEAD:feature/foundation-2.0
