name: Apply Foundation static final

on:
  push:
    branches: [feature/foundation-2.0]
    paths: [.github/workflows/apply-foundation-static-final.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foundation-2.0
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: python tools/foundation-static-final.py
      - run: vendor/bin/pint src/Command/CliPreflight.php src/Command/ParsedInput.php src/Process/ProcessRunner.php src/Routing/RouteCacheManager.php src/Scheduling/CronExpression.php src/Scheduling/ScheduleManager.php src/Scheduling/ScheduledCommand.php src/Worker/WorkerManager.php
      - run: composer ic:test:static
      - name: Commit validated source changes
        run: |
          rm -f .github/workflows/apply-foundation-static-final.yml
          git config user.name "abmmhasan"
          git config user.email "abmmhasan@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "Resolve Foundation execution static issues"
          git push origin HEAD:feature/foundation-2.0
