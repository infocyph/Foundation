# Strictly opt-in, branch-only release performance qualification. Never tags/merges.
# Admission evidence: immutable 40-trial control replay #43710386184, verified by guard QA #43710386121.
name: Foundation 4 hosted ARM full source performance qualification

on:
  push:
    branches:
      - diagnostics/foundation4-w4c1-controls
    paths:
      - .github/workflows/foundation4-hosted-arm-certify.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: foundation4-hosted-arm-source-qualification
  cancel-in-progress: false

jobs:
  validate-calibration:
    name: Require verified replay of frozen same-VM controls to be stable
    if: "${{ github.event.head_commit.message == 'perf: certify Foundation 4 on hosted ARM' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      control_run_id: ${{ steps.controls.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Locate successful immutable same-VM evidence replay
        id: controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f branch=diagnostics/foundation4-w4c1-controls -f per_page=30)"
          read -r run_id conclusion replay_sha < <(
            jq -er '[.workflow_runs[] | select(.name == "Foundation 4 same-VM calibration evidence replay")] | .[0] | [.id, .conclusion, .head_sha] | @tsv' <<<"$runs"
          )
          [[ "$run_id" =~ ^[1-9][0-9]*$ && "$conclusion" == success && "$replay_sha" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Most recent same-VM evidence replay did not pass." >&2
            exit 1
          }
          printf 'run_id=%s\nreplay_sha=%s\n' "$run_id" "$replay_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.controls.outputs.run_id }}
          github-token: ${{ github.token }}
          name: foundation4-same-vm-calibration-verdict
          path: build/calibration
      - name: Validate original source run, immutable receipts and strict controls
        env:
          FOUNDATION_CONTROL_TOOL_SHA: "3301810b3fd322e7734163aa24fb68c9f3f9eed4"
          REPLAY_SHA: ${{ steps.controls.outputs.replay_sha }}
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $p = json_decode((string) file_get_contents("build/calibration/provenance.json"), true, flags: JSON_THROW_ON_ERROR);
            if (!is_array($p)
                || ($p["source_run_id"] ?? null) !== 43686057250
                || ($p["source_commit_sha"] ?? null) !== "3301810b3fd322e7734163aa24fb68c9f3f9eed4"
                || ($p["source_artifact_id"] ?? null) !== 14158132871
                || ($p["source_artifact_sha256"] ?? null) !== "f5b7774e571230cb77f14627aa221b040d3723752c1f047563efb63e45d3bacc"
                || ($p["replay_commit_sha"] ?? null) !== getenv("REPLAY_SHA")) {
                throw new RuntimeException("Calibration provenance does not match original immutable measurements.");
            }
          '
          php benchmarks/foundation4-calibration-accept.php build/calibration/calibration.json
  qualify-complete-source-matrix:
    name: Complete both full source-only matrices and mandatory soaks
    needs: validate-calibration
    uses: ./.github/workflows/foundation4-host-certification.yml
    with:
      certify_source: true
      diagnostic_case: full-matrix
      baseline_ref: c220759fcbd6654fead843599712a5b79685f02d
      candidate_ref: 3fcebbfe06165a7363ea9e21ef55831469041fb3
      comparison_mode: source-only
      replay_run_id: "43570637823"
      replay_lock_sha256: 47714e7847c611f6cd8cef4caa45ac9ffae71188c93b7424d9daa867866f4ec7
      host_runner: ubuntu-24.04-arm
