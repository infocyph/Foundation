name: UID Plan Closure

on:
  push:
    branches:
      - foundation-3/runtime-architecture-plan
    paths:
      - .github/workflows/uid-plan-closure.yml

permissions:
  contents: write

jobs:
  close-uid-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: foundation-3/runtime-architecture-plan
          fetch-depth: 0

      - name: Reconcile Section 26.2
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          section_b64 = ''
          completion_b64 = ''

          plan_path = Path('docs/plans/foundation-3-final-runtime-development-plan.md')
          evidence_path = Path('docs/plans/foundation-3-uid-5-utilization-evidence.md')
          plan = plan_path.read_text()
          start_marker = '### 26.2 UID 5.0 utilization pass'
          end_marker = '### 26.3 CacheLayer 3.2.0 utilization pass'
          start = plan.index(start_marker)
          end = plan.index(end_marker, start)
          uid_section = base64.b64decode(section_b64).decode()
          plan = plan[:start] + uid_section + plan[end:]
          tracker_old = '- [ ] UID 5.0 current-version utilization pass.'
          tracker_new = '- [X] UID 5.0 current-version utilization pass.'
          if tracker_old not in plan:
              raise RuntimeError('UID tracker checkbox was not found in unchecked state.')
          plan = plan.replace(tracker_old, tracker_new, 1)
          plan_path.write_text(plan)

          evidence = evidence_path.read_text()
          completion_heading = '## Completion condition\n\n'
          completion_start = evidence.index(completion_heading)
          completion = base64.b64decode(completion_b64).decode()
          evidence_path.write_text(evidence[:completion_start] + completion)
          PY

      - name: Commit closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/plans/foundation-3-final-runtime-development-plan.md docs/plans/foundation-3-uid-5-utilization-evidence.md
          git diff --cached --check
          git commit -m "docs(uid): close Foundation UID utilization pass"
          git push origin HEAD:foundation-3/runtime-architecture-plan
