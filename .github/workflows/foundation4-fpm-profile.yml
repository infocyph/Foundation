name: Foundation 4 FPM request-path profile
on:
  push:
    branches: [diagnostic/foundation4-fpm-profile]
permissions:
  contents: read
  actions: read
env:
  BASELINE_SHA: 6274939c395f75e5cf777aad5d7439f10792758c
  CANDIDATE_SHA: 3f295de1a2a5a6287d016de8afe0903a0907e675
jobs:
  profile:
    name: Profile authenticated FPM w4/c1; diagnostic only
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: phpforge
          POSTGRES_PASSWORD: Phpforge_123!
          POSTGRES_DB: phpforge
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U phpforge -d phpforge" --health-interval 2s --health-timeout 2s --health-retries 30
      redis:
        image: redis:8.10-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      FOUNDATION_HOST_WORKLOAD_PROFILE: authenticated-read
      FOUNDATION_HOST_FILTER_HOST: fpm
      FOUNDATION_HOST_FILTER_WORKERS: "4"
      FOUNDATION_HOST_FILTER_CONCURRENCY: "1"
      FOUNDATION_HOST_REQUESTS: "100"
      FOUNDATION_HOST_REPEATS: "2"
      FOUNDATION_HOST_MIN_SECONDS: "0"
      FOUNDATION_HOST_WARMUP_SECONDS: "30"
      FOUNDATION_HOST_SOAK_SECONDS: "0"
      FOUNDATION_HOST_SERVER_CPU_SET: "2,3"
      FOUNDATION_HOST_LOAD_CPU_SET: "0"
      FOUNDATION_HOST_BACKEND_CPU_SET: "1"
      FOUNDATION_HOST_TOOL_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: "mbstring, intl, sodium, curl, pcntl, posix, sockets, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, memcached"
          ini-values: "opcache.enable_cli=1"
          coverage: xdebug
      - name: Prepare matched native host and profiling extension
        run: |
          test "$(nproc)" -ge 4
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.4-fpm
          if ! php-fpm8.4 -m | grep -qi '^xdebug$'; then
            extension="$(php -r 'echo ini_get("extension_dir") . "/xdebug.so";')"
            test -f "$extension"
            printf 'zend_extension=%s\n' "$extension" | sudo tee /etc/php/8.4/fpm/conf.d/20-xdebug.ini
          fi
          php-fpm8.4 -m | grep -qi '^xdebug$'
          docker update --cpuset-cpus 1 '${{ job.services.postgres.id }}' '${{ job.services.redis.id }}'
          printf 'FOUNDATION_CERTIFICATION_HOST_ID=github-fpm-profile-%s-%s\n' "$GITHUB_RUN_ID" "$(cat /proc/sys/kernel/random/boot_id)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: foundation4-paired-host-lock
          run-id: 39007164429
          github-token: ${{ github.token }}
          path: locked-dependencies
      - name: Install unchanged applications with identical dependencies
        run: |
          printf 'b557fba7662dba32601c3840f69f7ac394f253d729246fcba08db44e26067cb9  locked-dependencies/composer.lock\n' | sha256sum -c -
          for variant in baseline candidate; do
            cp locked-dependencies/composer.lock "$variant/composer.lock"
            cp -a tooling/benchmarks/. "$variant/benchmarks/"
            composer install --working-dir="$variant" --no-interaction --no-progress --prefer-dist
          done
          php <<'PHP'
          <?php
          $pdo = new PDO('pgsql:host=127.0.0.1;dbname=phpforge', 'phpforge', 'Phpforge_123!');
          foreach (['foundation_baseline', 'foundation_candidate'] as $database) {
              $pdo->exec('CREATE DATABASE ' . $database);
          }
          PHP
      - name: Profile selected requests after unprofiled requests warm each process
        run: |
          # Profiling changes timing: these files diagnose call costs, never certify RPM.
          python3 <<'PY'
          from pathlib import Path
          for variant in ['baseline', 'candidate']:
              path = Path(variant) / 'benchmarks/foundation4-host-load.php'
              source = path.read_text()
              old = '                curl_multi_add_handle($multi, $handle);\n                $sent++;'
              assert source.count(old) == 1
              source = source.replace(old, '                curl_setopt($handle, CURLOPT_COOKIE, $sent >= 80 && $sent < 88 ? "XDEBUG_TRIGGER=1" : "");\n' + old)
              path.write_text(source)
          PY
          cat > "$RUNNER_TEMP/profile-fpm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$FOUNDATION_HOST_RESULT_DIR/profiles"
          export XDEBUG_MODE=profile
          exec php-fpm8.4 -d xdebug.mode=profile -d xdebug.start_with_request=trigger \
            -d "xdebug.output_dir=$FOUNDATION_HOST_RESULT_DIR/profiles" \
            -d 'xdebug.profiler_output_name=cachegrind.out.%p.%u' -d xdebug.use_compression=0 "$@"
          SH
          chmod +x "$RUNNER_TEMP/profile-fpm"
          for variant in baseline candidate; do
            if [[ "$variant" == baseline ]]; then source_sha="$BASELINE_SHA"; else source_sha="$CANDIDATE_SHA"; fi
            FOUNDATION_HOST_SOURCE_SHA="$source_sha" \
              FOUNDATION_HOST_PG_DATABASE="foundation_$variant" \
              FOUNDATION_HOST_RESULT_DIR="$GITHUB_WORKSPACE/evidence/$variant" \
              FOUNDATION_HOST_FPM_BIN="$RUNNER_TEMP/profile-fpm" \
              bash "$GITHUB_WORKSPACE/$variant/benchmarks/foundation4-host-certify.sh"
            test "$(find "evidence/$variant/profiles" -type f -name 'cachegrind.out.*' | wc -l)" -ge 8
          done
      - name: Record source and environment provenance
        if: always()
        run: |
          mkdir -p evidence
          printf 'classification=diagnostic Xdebug profiles; not sustained RPM acceptance\nbaseline=%s\ncandidate=%s\ntooling=%s\n' "$BASELINE_SHA" "$CANDIDATE_SHA" "$GITHUB_SHA" > evidence/profile.env
          lscpu > evidence/cpu.txt
          php -v > evidence/php-version.txt
          sha256sum locked-dependencies/composer.lock > evidence/composer-lock.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: foundation4-fpm-request-profiles
          path: |
            evidence/profile.env
            evidence/cpu.txt
            evidence/php-version.txt
            evidence/composer-lock.sha256
            evidence/*/profiles/
            evidence/*/report.json
            evidence/*/*.log
          if-no-files-found: error
          retention-days: 30
