name: Format CacheLayer factory

on:
  push:
    branches: [feature/foundation-2.0]
    paths: [.github/workflows/format-cachelayer-factory.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foundation-2.0
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint src/Cache/CacheLayerFactory.php
      - name: Commit formatting
        run: |
          git config user.name "abmmhasan"
          git config user.email "abmmhasan@users.noreply.github.com"
          git add src/Cache/CacheLayerFactory.php
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit --no-verify -m "Format CacheLayer 3.1.2 integration"
          git push origin HEAD:feature/foundation-2.0
