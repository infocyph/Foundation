name: Foundation 2 PHPStan Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPStan diagnostics
        run: |
          set +e
          vendor/bin/phpstan analyse \
            --configuration=vendor/infocyph/phpforge/resources/phpstan.neon.dist \
            --memory-limit=1G \
            --no-progress \
            --error-format=table
          exit 0
