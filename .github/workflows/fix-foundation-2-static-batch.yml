              ('public function batchUniqueCheck(string $table, array $checks): array', 'public function batchUnique(string $table, array $checks): array'),
              ('@param array<int|string, mixed> $checks\n     * @return array<int, int|string>', '@param list<array<string, mixed>> $checks\n     * @return list<int|string>'),
          ])

          edit('src/Session/SessionServiceProvider.php', [
              ('use Infocyph\\Foundation\\Cache\\CacheLayerFactory;\n', 'use Infocyph\\Foundation\\Cache\\CacheLayerFactory;\nuse Infocyph\\Foundation\\Database\\DatabaseManager;\n'),
