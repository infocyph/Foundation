              ("$this->mergeHeaders($manifest['headers'], [$headerName => $headerValue], $headers)", '$this->mergeHeaders($manifest->headers, [$headerName => $headerValue], $headers)'),
              ('''     *   2: array{etag: string, lastModified: int, status: int, headers: array<string, string>},
''', '''     *   2: DownloadPreparation,
'''),
              ("status: $manifest['status'],", 'status: $manifest->status,'),
              ("$this->mergeHeaders($manifest['headers'], $headers)", '$this->mergeHeaders($manifest->headers, $headers)'),
              ('''    /**
