     * } $manifest
     * @param array<string, string|list<string>> $headers
     */
    private function shortCircuitResponse(Request $request, array $manifest, array $headers): ?Response
''', '''    /** @param array<string, string|list<string>> $headers */
    private function shortCircuitResponse(Request $request, DownloadPreparation $manifest, array $headers): ?Response
'''),
          ])

          # No-BC major: remove the obsolete static facade and generic ArrayKit forwarding layers.
          import shutil
          shutil.rmtree('src/Facades', ignore_errors=True)
          shutil.rmtree('src/Data', ignore_errors=True)

      - name: Format changed PHP
        run: |
          vendor/bin/pint \
            src/Auth/Internal/AuthCoreRegistrar.php \
            src/Auth/AuthServiceProvider.php \
            src/Cache/CacheLayerFactory.php \
            src/Communication/CommunicationManager.php \
            src/Config/ConfigLoader.php \
            src/Config/ConfigCacheManager.php \
            src/Module/ModuleCatalog.php \
            src/Module/ModuleManager.php \
            src/Database/DatabaseRepository.php \
            src/Validation/ReqShieldDatabaseProvider.php \
            src/Session/SessionServiceProvider.php \
            src/Testing/TestKit.php \
            src/Filesystem/FilesystemManager.php \
            src/Filesystem/FilesystemUploadRequestHandler.php \
            src/Filesystem/FilesystemResponseFactory.php
      - name: Commit batch
        run: |
          git config user.name "abmmhasan"
          git config user.email "abmmhasan@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "Resolve Foundation 2.0 integration type drift"
          git push origin HEAD:feature/foundation-2.0
