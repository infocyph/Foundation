name: Foundation 2.0 static fix batch

on:
  push:
    branches: [feature/foundation-2.0]
    paths: [.github/workflows/fix-foundation-2-static-batch.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foundation-2.0
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply static-analysis fixes
        shell: python
        run: |
          from pathlib import Path

          def edit(path, transforms):
              p = Path(path)
              s = p.read_text()
              for old, new in transforms:
                  if old not in s:
                      raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
                  s = s.replace(old, new)
              p.write_text(s)

          edit('src/Auth/Internal/AuthCoreRegistrar.php', [
              ('use Infocyph\\Foundation\\Application\\Application;\n', ''),
              ('''    public function __construct(
        private Application $app,
        private Container $container,
    ) {}
''', '''    public function __construct(private Container $container) {}
'''),
          ])
          edit('src/Auth/AuthServiceProvider.php', [
              ('new AuthCoreRegistrar($app, $container)->register($drivers);', 'new AuthCoreRegistrar($container)->register($drivers);'),
          ])

          edit('src/Cache/CacheLayerFactory.php', [
              ('return array_values(ValueNormalizer::stringList($value));', 'return ValueNormalizer::stringList($value);'),
              ('@return array<int, array{0:string,1:int,2:int}>', '@return list<array{0:string,1:int,2:int}>'),
              ('return array_values($descriptors);', 'return $descriptors;'),
          ])

          edit('src/Communication/CommunicationManager.php', [
              ('''    /** @param array<string, mixed> $config @return array<string, mixed> */
    private function arrayValue(array $config, string $key): array
''', '''    /**
     * @param array<string, mixed> $config
     * @return array<string, mixed>
     */
    private function arrayValue(array $config, string $key): array
'''),
          ])

          edit('src/Config/ConfigLoader.php', [
              ('''    /** @param array<string, mixed> $input @return array<string, mixed> */
    private function normalizeInput(array $input): array
''', '''    /**
     * @param array<string, mixed> $input
     * @return array<string, mixed>
     */
    private function normalizeInput(array $input): array
'''),
              ("return ['type' => self::TYPE_SINGLE, 'data' => $payload['_data']];", "return ['type' => self::TYPE_SINGLE, 'data' => $this->map($payload['_data'])];"),
              ("if (is_string($namespace) && is_array($value) && preg_match('/^[A-Za-z0-9_-]+$/', $namespace) === 1) {", "if (is_array($value) && preg_match('/^[A-Za-z0-9_-]+$/', $namespace) === 1) {"),
          ])

          edit('src/Config/ConfigCacheManager.php', [
              ('use Infocyph\\Foundation\\Application\\ProviderFileLoader;\n', 'use Infocyph\\Foundation\\Application\\ProviderFileLoader;\nuse Infocyph\\Foundation\\Application\\ServiceProviderInterface;\n'),
              ('''     * @param array<string, mixed> $configured
     * @param array{common:list<class-string>,web:list<class-string>,cli:list<class-string>,worker:list<class-string>,scheduler:list<class-string>} $fromFile
     * @return array<string, list<class-string>>
''', '''     * @param array<array-key, mixed> $configured
     * @param array{common:list<class-string<ServiceProviderInterface>>,web:list<class-string<ServiceProviderInterface>>,cli:list<class-string<ServiceProviderInterface>>,worker:list<class-string<ServiceProviderInterface>>,scheduler:list<class-string<ServiceProviderInterface>>} $fromFile
     * @return array{common:list<class-string<ServiceProviderInterface>>,web:list<class-string<ServiceProviderInterface>>,cli:list<class-string<ServiceProviderInterface>>,worker:list<class-string<ServiceProviderInterface>>,scheduler:list<class-string<ServiceProviderInterface>>}
'''),
              ('''                if (is_string($provider) && $provider !== '') {
                    $groupProviders[$provider] = $provider;
                }
''', '''                if (
                    is_string($provider)
                    && $provider !== ''
                    && is_subclass_of($provider, ServiceProviderInterface::class)
                ) {
                    /** @var class-string<ServiceProviderInterface> $provider */
                    $groupProviders[$provider] = $provider;
                }
'''),
          ])

          edit('src/Module/ModuleCatalog.php', [
              ('final class ModuleCatalog\n{', '''/**
 * @phpstan-type ModuleDefinition array{package:string|null,constraint:string|null,built_in?:bool,description:string,aliases:list<string>,config:list<string>}
 * @phpstan-type ResolvedModule array{name:string,package:string|null,constraint:string|null,built_in?:bool,description:string,aliases:list<string>,config:list<string>}
 */
final class ModuleCatalog
{'''),
