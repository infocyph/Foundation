              ('/** @return array<string, mixed> */\n    public function resolve(string $module): array', '/** @return ResolvedModule */\n    public function resolve(string $module): array'),
          ])

          edit('src/Module/ModuleManager.php', [
              ('''    /** @return array<string, mixed> */
    private function directRequirements(): array
    {
        $path = $this->application->basePath('composer.json');
        $contents = is_file($path) ? file_get_contents($path) : false;
        if (!is_string($contents)) {
            return [];
        }

        try {
            $composer = json_decode($contents, true, flags: JSON_THROW_ON_ERROR);
        } catch (\\JsonException) {
            return [];
        }

        return is_array($composer['require'] ?? null) ? $composer['require'] : [];
    }
''', '''    /** @return array<string, string> */
    private function directRequirements(): array
    {
        $path = $this->application->basePath('composer.json');
        $contents = is_file($path) ? file_get_contents($path) : false;
        if (!is_string($contents)) {
            return [];
        }

        try {
            $composer = json_decode($contents, true, flags: JSON_THROW_ON_ERROR);
        } catch (\\JsonException) {
            return [];
        }
        if (!is_array($composer) || !is_array($composer['require'] ?? null)) {
            return [];
        }

        $requirements = [];
        foreach ($composer['require'] as $package => $constraint) {
            if (is_string($package) && is_string($constraint)) {
                $requirements[$package] = $constraint;
            }
        }

        return $requirements;
    }
'''),
          ])

          edit('src/Database/DatabaseRepository.php', [
              ('''        parent::__construct(
            $connection,
