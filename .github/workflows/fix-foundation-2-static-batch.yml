          ])

          edit('src/Testing/TestKit.php', [
              ('use Infocyph\\Foundation\\Cache\\CacheManager;\n', 'use Infocyph\\Foundation\\Cache\\CacheManager;\nuse Infocyph\\Foundation\\Database\\DatabaseManager;\n'),
              ('return $this->application->cache();', 'return $this->application->make(CacheManager::class);'),
              ('return new DatabaseTestManager($this->application->db());', 'return new DatabaseTestManager($this->application->make(DatabaseManager::class));'),
              ('return $this->application->files();', 'return $this->application->make(FilesystemManager::class);'),
              ('return $this->application->messaging();', 'return $this->application->make(MessagingManager::class);'),
          ])

          # Pathwise 3.1 returns typed result objects; preserve them instead of recreating legacy array contracts.
          edit('src/Filesystem/FilesystemManager.php', [
