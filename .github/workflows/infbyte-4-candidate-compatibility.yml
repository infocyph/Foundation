name: "Infbyte 4 candidate compatibility (read-only)"

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

jobs:
  current-source-candidate:
    name: "Infbyte 4 current Foundation source / PHP ${{ matrix.php }}"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/foundation-3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - name: Check out existing Infbyte 4 application candidate
        uses: actions/checkout@v7
        with:
          repository: infocyph/Infbyte
          ref: feature/infbyte-4
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Resolve the declared Foundation development dependency
        run: |
          set -euo pipefail
          composer validate --strict
          composer update --no-interaction --prefer-dist --no-progress

      - name: Require the exact Foundation PR head
        env:
          EXPECTED_FOUNDATION_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $manifest = json_decode(file_get_contents("composer.json"), true, flags: JSON_THROW_ON_ERROR);
            if (($manifest["require"]["infocyph/foundation"] ?? null) !== "dev-feature/foundation-3") {
                fwrite(STDERR, "Expected the unreleased Infbyte 4 candidate, not a stable cutover." . PHP_EOL);
                exit(1);
            }
          '
          installed_sha="$(php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true, flags: JSON_THROW_ON_ERROR);
            foreach (($lock["packages"] ?? []) as $package) {
                if (($package["name"] ?? null) !== "infocyph/foundation") {
                    continue;
                }
                $sha = $package["source"]["reference"] ?? $package["dist"]["reference"] ?? null;
                if (!is_string($sha) || preg_match("/^[a-f0-9]{40}$/D", $sha) !== 1) {
                    fwrite(STDERR, "Foundation resolved without an immutable source reference." . PHP_EOL);
                    exit(1);
                }
                echo $sha;
                exit(0);
            }
            fwrite(STDERR, "Foundation absent from the resolved package graph." . PHP_EOL);
            exit(1);
          ')"
          echo "Foundation candidate source: $installed_sha"
          if [[ "$installed_sha" != "$EXPECTED_FOUNDATION_SHA" ]]; then
            printf 'Foundation source drift: installed=%s expected PR head=%s\n' "$installed_sha" "$EXPECTED_FOUNDATION_SHA" >&2
            exit 1
          fi
          {
            echo "### Foundation / Infbyte 4 candidate evidence"
            echo "- Foundation source commit: $installed_sha"
            echo "- Infbyte branch: feature/infbyte-4"
            echo "- PHP version: ${{ matrix.php }}"
            echo "- Dependency status: **development candidate, not published stable**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify qualified optional features and Core-only application
        run: |
          set -euo pipefail
          php infbyte module:list --json=1 | php -r '
            $data=json_decode(stream_get_contents(STDIN), true, flags: JSON_THROW_ON_ERROR);
            $modules=$data["modules"] ?? [];
            $names=array_column($modules, "name");
            $count=array_sum(array_map(static fn(array $entry): int => count($entry["features"] ?? []), $modules));
            if (($data["schema_version"] ?? null)!==2
                || $names!==["data","security","execution"]
                || $count!==8
            ) {
                fwrite(STDERR, "Infbyte candidate module topology no longer matches Foundation 4." . PHP_EOL);
                exit(1);
            }
          '
          php infbyte route:list

      - name: Exercise documented Webrick health endpoint and TestKit
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            $app = \Infocyph\Foundation\Foundation::web([
                "base_path" => getcwd(),
                "_config_cache" => false,
                "app" => ["env" => "testing", "capabilities" => []],
            ])->boot();
            $testKit = $app->make(\Infocyph\Foundation\Testing\TestKit::class);
            $response = $testKit->http()->get("/api/health");
            $response->assertStatus(200)->assertJson(["status" => "ok"]);
          '

      - name: Check compiled Core production readiness
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_CAPABILITIES: ""
        run: |
          set -euo pipefail
          php infbyte app:install
          php infbyte config:validate --production
          php infbyte optimize --json=1 > /tmp/infbyte-foundation4-candidate-release.json
          php infbyte app:ready
          php -r '
            $artifact=json_decode(file_get_contents("/tmp/infbyte-foundation4-candidate-release.json"), true, flags: JSON_THROW_ON_ERROR);
            $manifest=$artifact["manifest"] ?? null;
            $expected=$artifact["manifest_sha256"] ?? null;
            if (!is_string($manifest) || !is_file($manifest) || !is_string($expected)
                || !hash_equals($expected, hash_file("sha256", $manifest))) {
                fwrite(STDERR, "The candidate built an unverified Foundation generation." . PHP_EOL);
                exit(1);
            }
          '
