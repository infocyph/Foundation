name: Foundation 4 native HTTP host smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - .github/workflows/foundation4-host-certification.yml
      - composer.json
      - composer.lock
      - src/**
      - resources/**
      - tests/Feature/WebReleaseRuntimeTest.php
      - benchmarks/foundation4-host-certify.sh
      - benchmarks/foundation4-host-load.php
      - benchmarks/foundation4-host-report.php
      - benchmarks/Phase9NativeReadHandler.php
      - benchmarks/phase9-server-compile.php

permissions:
  contents: read

concurrency:
  group: foundation4-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FOUNDATION_HOST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: "mbstring, intl, sodium, curl, pcntl, posix, sockets, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, memcached"
          ini-values: "opcache.enable_cli=1"
          coverage: none
      - name: Install native host and load tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.4-fpm
          php-fpm8.4 -v
          nginx -v
          php -r 'if (!extension_loaded("curl")) { exit(1); }'
      - name: Resolve Foundation 4 and selected Runwire dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-stable
      - name: Exercise FPM and native Runwire host processes
        env:
          FOUNDATION_HOST_REQUESTS: "900"
          FOUNDATION_HOST_REPEATS: "3"
          FOUNDATION_HOST_SOAK_SECONDS: "30"
          FOUNDATION_HOST_RESULT_DIR: ${{ github.workspace }}/build/foundation4-host
        run: bash benchmarks/foundation4-host-certify.sh
      - name: Verify selected DBLayer CacheLayer and credential workload
        env:
          FOUNDATION_HOST_WORKLOAD_PROFILE: native-read
          FOUNDATION_HOST_REQUESTS: "120"
          FOUNDATION_HOST_REPEATS: "2"
          FOUNDATION_HOST_SOAK_SECONDS: "30"
          FOUNDATION_HOST_RESULT_DIR: ${{ github.workspace }}/build/foundation4-native
        run: bash benchmarks/foundation4-host-certify.sh
      - name: Capture host toolchain and dependency identity
        if: always()
        run: |
          mkdir -p build/foundation4-host
          php -v > build/foundation4-host/php-version.txt
          php -m > build/foundation4-host/php-extensions.txt
          php --ini=diff > build/foundation4-host/php-ini-diff.txt
          if test -f composer.lock; then
            composer show --locked --format=json > build/foundation4-host/dependencies.json
            sha256sum composer.lock > build/foundation4-host/composer-lock.sha256
          else
            printf 'dependency_resolution=not_completed\\n' > build/foundation4-host/dependency-resolution.env
          fi
          git rev-parse HEAD > build/foundation4-host/commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: foundation4-native-host-${{ github.sha }}
          path: |
            build/foundation4-host/
            build/foundation4-native/
          if-no-files-found: warn
          retention-days: 30
