name: Fix CacheLayer 3.1.2 integration

on:
  push:
    branches: [feature/foundation-2.0]
    paths: [.github/workflows/fix-cachelayer-312.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foundation-2.0
          fetch-depth: 0

      - name: Align CacheLayerFactory with 3.1.2
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('src/Cache/CacheLayerFactory.php')
          source = path.read_text()

          source = source.replace(
              'use Infocyph\\CacheLayer\\Cache\\CacheInterface;\n',
              'use Infocyph\\CacheLayer\\Cache\\CacheInterface;\nuse Infocyph\\CacheLayer\\Cache\\CacheOptions;\n',
          )
          source = source.replace(
              '        $this->applyCacheConfiguration($runtime->cache(), $store, CacheDriver::NODE);\n\n',
              '',
          )

          start = source.index('    private function applyCacheConfiguration(')
          end = source.index('    /**\n     * @param array<string, mixed> $store\n     */\n    private function applyLockConfiguration(', start)
          source = source[:start] + '''    private function applyCacheConfiguration(CacheInterface $cache, array $store, CacheDriver $driver): CacheInterface
          {
              return $this->applyLockConfiguration($cache, $store, $driver);
          }

          ''' + source[end:]

          marker = '    /**\n     * @param array<string, mixed> $store\n     * @return array{threshold_bytes:?int,level:int}\n     */\n    private function compressionConfig(array $store): array\n'
          insert = '''    /** @param array<string, mixed> $store */
          private function cacheOptions(array $store): CacheOptions
          {
              $compression = $this->compressionConfig($store);
              $security = $this->securityConfig($store);
              $serialization = $this->serializationConfig($store);

              return new CacheOptions(
                  integrityKey: $security['integrity_key'],
                  maxPayloadBytes: $security['max_payload_bytes'],
                  compressionThreshold: $compression['threshold_bytes'],
                  compressionLevel: $compression['level'],
                  allowClosures: $serialization['allow_closure_payloads'],
                  allowObjects: $serialization['allow_object_payloads'],
                  failOpen: ValueNormalizer::bool($store['fail_open'] ?? null, true),
              );
          }

          '''
          source = source.replace(marker, insert + marker)

          start = source.index('    private function createCache(')
          end = source.index('    /**\n     * @param array<string, array<string, mixed>> $stores', start)
          create_cache = '''    private function createCache(string $name, array $store, CacheDriver $driver): CacheInterface
          {
              $namespace = $this->namespace($name, $store);
              $options = $this->cacheOptions($store);

              return match ($driver) {
                  CacheDriver::APCU => Cache::apcu($namespace, $options),
                  CacheDriver::FILE => Cache::file(
                      $namespace,
                      $this->directoryFrom($store, 'path', 'dir', 'directory'),
                      $options,
                  ),
                  CacheDriver::LOCAL => $this->localCache($namespace, $store, $options),
                  CacheDriver::MEMCACHE => Cache::memcached(
                      namespace: $namespace,
                      servers: $this->servers($store['servers'] ?? null),
                      options: $options,
                  ),
                  CacheDriver::MEMORY => Cache::memory($namespace, $options),
                  CacheDriver::MONGODB => Cache::mongodb(
                      namespace: $namespace,
                      collection: is_object($store['collection'] ?? null) ? $store['collection'] : null,
                      client: is_object($store['client'] ?? null) ? $store['client'] : null,
                      database: ValueNormalizer::string($store['database'] ?? null, 'cachelayer'),
                      collectionName: ValueNormalizer::string($store['collection_name'] ?? null, 'entries'),
                      uri: ValueNormalizer::string($store['uri'] ?? null, 'mongodb://127.0.0.1:27017'),
                      options: $options,
                  ),
                  CacheDriver::NODE => NodeCache::create($this->nodeConfig($name, $store)),
                  CacheDriver::NULL_STORE => Cache::nullStore($options),
                  CacheDriver::PDO => $this->pdoCache($namespace, $store, $options),
                  CacheDriver::PHP_FILES => Cache::phpFiles(
                      $namespace,
                      $this->directoryFrom($store, 'path', 'dir', 'directory'),
                      $options,
                  ),
                  CacheDriver::REDIS => $this->redisCache($namespace, $store, 'redis', $options),
                  CacheDriver::REDIS_CLUSTER => Cache::redisCluster(
                      namespace: $namespace,
                      seeds: $this->seeds($store['seeds'] ?? null),
                      timeout: $this->floatValue($store['timeout'] ?? null, 1.0),
                      readTimeout: $this->floatValue($store['read_timeout'] ?? null, 1.0),
                      persistent: ValueNormalizer::bool($store['persistent'] ?? null, false),
                      client: is_object($store['client'] ?? null) ? $store['client'] : null,
                      options: $options,
                  ),
                  CacheDriver::SCYLLADB => Cache::scylla(
                      namespace: $namespace,
                      session: $this->scyllaSession($store),
                      keyspace: ValueNormalizer::string($store['keyspace'] ?? null, 'cachelayer'),
                      table: ValueNormalizer::string($store['table'] ?? null, 'cachelayer_entries'),
                      options: $options,
                  ),
                  CacheDriver::SHARED_MEMORY => Cache::sharedMemory(
                      $namespace,
                      ValueNormalizer::int($store['segment_size'] ?? null, 16_777_216),
                      $options,
                  ),
                  CacheDriver::SQLITE => Cache::sqlite(
                      $namespace,
                      $this->sqliteFile($store),
                      $options,
                  ),
                  CacheDriver::TIERED => Cache::tiered(
                      tiers: $this->tiers($name, $store),
                      writeToL1: ValueNormalizer::bool($store['write_to_l1'] ?? null, true),
                      options: $options,
                      namespace: $namespace,
                  ),
                  CacheDriver::VALKEY => $this->redisCache($namespace, $store, 'valkey', $options),
                  CacheDriver::WEAK_MAP => Cache::weakMap($namespace, $options),
              };
          }

          '''
          source = source[:start] + create_cache + source[end:]

          local_marker = '    /**\n     * @param array<string, mixed> $store\n     * @param array<string, mixed> $lock\n     */\n    private function lockProviderFromConfig('
          local_method = '''    /** @param array<string, mixed> $store */
          private function localCache(string $namespace, array $store, CacheOptions $options): CacheInterface
          {
              if (extension_loaded('apcu') && function_exists('apcu_enabled') && apcu_enabled()) {
                  return Cache::apcu($namespace, $options);
              }

              return Cache::file(
                  $namespace,
                  $this->directoryFrom($store, 'path', 'dir', 'directory'),
                  $options,
              );
          }

          '''
          source = source.replace(local_marker, local_method + local_marker)

          source = source.replace(
              '    private function pdoCache(string $namespace, array $store): CacheInterface\n',
              '    private function pdoCache(string $namespace, array $store, CacheOptions $options): CacheInterface\n',
          )
          source = source.replace(
              "            table: ValueNormalizer::string($store['table'] ?? null, 'cachelayer_entries'),\n        );\n    }\n\n    /**\n     * @param array<string, mixed> $store\n     * @param array<string, mixed> $lock\n     */\n    private function pdoClientFromConfig",
              "            table: ValueNormalizer::string($store['table'] ?? null, 'cachelayer_entries'),\n            options: $options,\n        );\n    }\n\n    /**\n     * @param array<string, mixed> $store\n     * @param array<string, mixed> $lock\n     */\n    private function pdoClientFromConfig",
          )

          source = source.replace(
              '    private function redisCache(string $namespace, array $store, string $driver): CacheInterface\n',
              '    private function redisCache(string $namespace, array $store, string $driver, CacheOptions $options): CacheInterface\n',
          )
          source = source.replace(
              "            ? Cache::valkey($namespace, $connection['dsn'], $connection['client'])\n            : Cache::redis($namespace, $connection['dsn'], $connection['client']);",
              "            ? Cache::valkey($namespace, $connection['dsn'], $connection['client'], $options)\n            : Cache::redis($namespace, $connection['dsn'], $connection['client'], $options);",
          )

          source = source.replace('     * @return array<int, string>\n     */\n    private function seeds', '     * @return list<string>\n     */\n    private function seeds')
          source = source.replace('        return ValueNormalizer::stringList($value);\n    }\n\n    /**\n     * @param array<string, mixed> $store\n     * @return array{allow_closure_payloads:bool,allow_object_payloads:bool}', '        return array_values(ValueNormalizer::stringList($value));\n    }\n\n    /**\n     * @param array<string, mixed> $store\n     * @return array{allow_closure_payloads:bool,allow_object_payloads:bool}')
          source = source.replace('     * @return array<int, array<string, mixed>>\n     */\n    private function tiers', '     * @return list<array<string, mixed>>\n     */\n    private function tiers')
          source = source.replace('        return $descriptors;\n    }\n\n    private function transport', '        return array_values($descriptors);\n    }\n\n    private function transport')

          path.write_text(source)

      - name: Commit migration
        run: |
          git config user.name "abmmhasan"
          git config user.email "abmmhasan@users.noreply.github.com"
          git add src/Cache/CacheLayerFactory.php
          git diff --cached --check
          git commit --no-verify -m "Align CacheLayer integration with 3.1.2"
          git push origin HEAD:feature/foundation-2.0
