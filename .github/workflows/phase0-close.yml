name: Close Foundation 3 Phase 0 Ledger

on:
  push:
    branches:
      - foundation-3/runtime-architecture-plan
    paths:
      - .github/workflows/phase0-close.yml

permissions:
  contents: write

jobs:
  close-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation-3/runtime-architecture-plan
          fetch-depth: 1

      - name: Mark Phase 0 complete
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('docs/plans/foundation-3-final-runtime-development-plan.md')
          text = path.read_text()
          replacements = {
              '- [ ] Phase 0 — Freeze baselines': '- [x] Phase 0 — Freeze baselines',
              '- [ ] Record direct InterMix 10.0.3 development and generated-production DI baselines.': '- [x] Record direct InterMix 10.0.3 development and generated-production DI baselines.',
              '- [ ] Record standalone Webrick 5.1 compiled HTTP baselines.': '- [x] Record standalone Webrick 5.1 compiled HTTP baselines.',
              '- [ ] Record current Foundation representative baseline before architecture changes.': '- [x] Record current Foundation representative baseline before architecture changes.',
              '- [ ] Pin exact InterMix/Webrick/Foundation source/tag/commit identities in benchmark output.': '- [x] Pin exact InterMix/Webrick/Foundation source/tag/commit identities in benchmark output.',
              '- [ ] Capture semantic behavior tests that Foundation 3 must preserve.': '- [x] Capture semantic behavior tests that Foundation 3 must preserve.',
              '- [ ] Record baseline memory, throughput, latency and cold/warm boot data needed for later attribution.': '- [x] Record baseline memory, throughput, latency and cold/warm boot data needed for later attribution.',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected Phase 0 ledger entry: {old}')
              text = text.replace(old, new, 1)

          evidence = 'Baseline evidence: `docs/baselines/foundation-3-phase-0/README.md`.'
          marker = '- [x] Record baseline memory, throughput, latency and cold/warm boot data needed for later attribution.'
          if evidence not in text:
              text = text.replace(marker, marker + '\n\n' + evidence, 1)

          path.write_text(text)
          PY

      - name: Commit ledger closure and remove one-shot workflow
        run: |
          rm .github/workflows/phase0-close.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/plans/foundation-3-final-runtime-development-plan.md .github/workflows/phase0-close.yml
          git commit -m 'docs: mark Foundation 3 Phase 0 complete'
          git push origin HEAD:foundation-3/runtime-architecture-plan
