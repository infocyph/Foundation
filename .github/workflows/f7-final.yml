name: "F7 Gate Runner"

on:
  push:
    branches: [ "feature/oauth-2.1" ]
    paths: [ "tools/f7-run/gate.txt" ]
  workflow_dispatch:
    inputs:
      gate:
        description: "F7 gate to execute"
        required: true
        default: "f7.3"
        type: choice
        options:
          - f7.3
          - f7.4
          - f7.5
          - f7.6
          - f7.7
          - f7.8
          - f7.9
          - all

permissions:
  contents: read
  actions: read

concurrency:
  group: foundation-f7-${{ github.event.inputs.gate || github.ref }}
  cancel-in-progress: false

env:
  XDEBUG_MODE: off
  PHPFORGE_SERVICE_DATABASE: phpforge
  PHPFORGE_SERVICE_USERNAME: phpforge
  PHPFORGE_SERVICE_PASSWORD: Phpforge_123!
  IC_SERVICE_DATABASE: phpforge
  IC_SERVICE_USERNAME: phpforge
  IC_SERVICE_PASSWORD: Phpforge_123!
  IC_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=phpforge;charset=utf8mb4"
  IC_MYSQL_PRIMARY_DSN: "mysql:host=127.0.0.1;port=3306;dbname=phpforge;charset=utf8mb4"
  IC_MYSQL_REPLICA_DSN: "mysql:host=127.0.0.1;port=3307;dbname=phpforge;charset=utf8mb4"
  IC_MYSQL_USER: phpforge
  IC_MYSQL_PASSWORD: Phpforge_123!
  IC_POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=phpforge"
  IC_POSTGRES_PRIMARY_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=phpforge"
  IC_POSTGRES_REPLICA_DSN: "pgsql:host=127.0.0.1;port=5433;dbname=phpforge"
  IC_POSTGRES_USER: phpforge
  IC_POSTGRES_PASSWORD: Phpforge_123!
  IC_SQLITE_MEMORY_DSN: "sqlite::memory:"
  IC_SQLITE_FILE_DSN: "sqlite:/tmp/phpforge.sqlite"
  IC_REDIS_HOST: 127.0.0.1
  IC_REDIS_PORT: 6379
  IC_REDIS_REPLICA_HOST: 127.0.0.1
  IC_REDIS_REPLICA_PORT: 6381
  IC_REDIS_PASSWORD: Phpforge_123!
  IC_VALKEY_HOST: 127.0.0.1
  IC_VALKEY_PORT: 6380
  IC_VALKEY_REPLICA_HOST: 127.0.0.1
  IC_VALKEY_REPLICA_PORT: 6382
  IC_VALKEY_PASSWORD: Phpforge_123!
  IC_MEMCACHED_HOST: 127.0.0.1
  IC_MEMCACHED_PORT: 11211

jobs:
  select:
    name: Select requested F7 gate
    runs-on: ubuntu-24.04
    outputs:
      gate: ${{ steps.gate.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        name: Resolve gate selector
        shell: bash
        env:
          DISPATCH_GATE: ${{ github.event.inputs.gate }}
        run: |
          gate="${DISPATCH_GATE:-$(tr -d '[:space:]' < tools/f7-run/gate.txt)}"
          case "$gate" in
            f7.3|f7.4|f7.5|f7.6|f7.7|f7.8|f7.9|all) ;;
            *) echo "Unsupported F7 gate: $gate" >&2; exit 2 ;;
          esac
          echo "value=$gate" >> "$GITHUB_OUTPUT"
          echo "Selected $gate"

  performance-budget:
    name: F7.3 existing-path regression budget
    needs: select
    if: needs.select.outputs.gate == 'f7.3' || needs.select.outputs.gate == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/oauth-2.1
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: "2.0"
          path: baseline
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached
          coverage: none
      - name: Install equivalent stable dependency sets
        shell: bash
        run: |
          (cd baseline && composer update --no-interaction --prefer-dist --no-progress --prefer-stable)
          (cd candidate && composer update --no-interaction --prefer-dist --no-progress --prefer-stable)
      - name: Measure identical OAuth-disabled application bearer path
        shell: bash
        env:
          FOUNDATION_BENCHMARK_FINGERPRINT: "${{ runner.os }}-${{ runner.arch }}-php85-${{ github.run_id }}"
        run: |
          (cd baseline && FOUNDATION_BENCHMARK_REF=2.0 php ../candidate/tools/f7-existing-path-benchmark.php build/f7-existing-path.json)
          (cd candidate && FOUNDATION_BENCHMARK_REF=${{ github.sha }} php tools/f7-existing-path-benchmark.php build/f7-existing-path.json)
      - name: Enforce measured two-percent median regression budget
        shell: bash
        run: |
          php -r '
          $baseline = json_decode((string) file_get_contents("baseline/build/f7-existing-path.json"), true, 512, JSON_THROW_ON_ERROR);
          $candidate = json_decode((string) file_get_contents("candidate/build/f7-existing-path.json"), true, 512, JSON_THROW_ON_ERROR);
          $base = (float) $baseline["median_rpm"];
          $next = (float) $candidate["median_rpm"];
          if ($base <= 0.0 || $next <= 0.0) { fwrite(STDERR, "Invalid F7 benchmark median.\n"); exit(2); }
          $regression = (($base - $next) / $base) * 100.0;
          $result = [
              "schema_version" => 1,
              "gate" => "F7.3",
              "baseline_ref" => "2.0",
              "candidate_ref" => getenv("GITHUB_SHA") ?: null,
              "baseline_median_rpm" => $base,
              "candidate_median_rpm" => $next,
              "regression_percent" => $regression,
              "budget_percent" => 2.0,
              "passed" => $regression <= 2.0,
          ];
          file_put_contents("f7-performance-summary.json", json_encode($result, JSON_PRETTY_PRINT | JSON_THROW_ON_ERROR) . PHP_EOL);
          echo json_encode($result, JSON_THROW_ON_ERROR) . PHP_EOL;
          exit($regression <= 2.0 ? 0 : 1);
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: f7-3-performance-budget
          path: |
            baseline/build/f7-existing-path.json
            candidate/build/f7-existing-path.json
            f7-performance-summary.json
          if-no-files-found: error

  persistent-worker:
    name: F7.4 persistent worker reset and soak
    needs: select
    if: needs.select.outputs.gate == 'f7.4' || needs.select.outputs.gate == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Run reset and sustained worker isolation coverage
        run: >-
          vendor/bin/pest --fail-on-skipped
          tests/Feature/OAuth21PersistentPrincipalResetTest.php
          tests/Feature/OAuth21PersistentWorkerSoakTest.php
          tests/Feature/PersistentRuntimeSoakTest.php

  composer-runtime:
    name: F7.5 Composer/runtime PHP ${{ matrix.php }}
    needs: select
    if: needs.select.outputs.gate == 'f7.5' || needs.select.outputs.gate == 'all'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.4", "8.5" ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached
          coverage: none
      - name: Validate package metadata
        run: composer validate --strict
      - name: Resolve supported stable dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Audit resolved dependency graph with Foundation release policy
        run: composer ic:release:audit
      - name: Verify release constraints and platform requirements
        shell: bash
        run: |
          composer check-platform-reqs
          composer ic:release:constraints
      - name: Verify optimized runtime autoload
        shell: bash
        run: |
          composer dump-autoload --classmap-authoritative --no-interaction
          php -r 'require "vendor/autoload.php"; fwrite(STDOUT, "autoload-ok\n");'

  phpforge-engineering:
    name: F7.6 PHPForge engineering gates
    needs: select
    if: needs.select.outputs.gate == 'f7.6' || needs.select.outputs.gate == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Syntax gate
        run: composer ic:test:syntax
      - name: Style gate
        run: composer ic:test:lint
      - name: Sniff gate
        run: composer ic:test:sniff
      - name: Refactor gate
        run: composer ic:test:refactor
      - name: Static and cognitive-complexity gate
        run: composer ic:test:static
      - name: Security analysis gate
        run: composer ic:test:security
      - name: Architecture gate
        run: composer ic:test:architecture
      - name: Duplicate gate
        run: composer ic:test:duplicates
      - name: Comment policy gate
        run: composer ic:test:comments

  full-pest:
    name: F7.7 Pest PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    needs: select
    if: needs.select.outputs.gate == 'f7.7' || needs.select.outputs.gate == 'all'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.4", "8.5" ]
        dependencies: [ "prefer-lowest", "prefer-stable" ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: infocyph/phpforge
          ref: main
          path: .phpforge-workflow
          sparse-checkout: |
            .github/scripts/verify-and-wait-services.sh
            resources/services
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached
          coverage: none
      - name: Start PHPForge integration services
        shell: bash
        run: |
          docker compose -f .phpforge-workflow/resources/services/compose.yml \
            --profile mysql --profile postgres --profile redis --profile valkey --profile memcached up -d
          bash .phpforge-workflow/.github/scripts/verify-and-wait-services.sh
      - name: Resolve requested dependency boundary
        shell: bash
        run: composer update --no-interaction --prefer-dist --no-progress --${{ matrix.dependencies }}
      - name: Run complete Pest suite with skipped tests fatal
        env:
          IC_PEST_FAIL_ON_SKIPPED: "1"
        run: composer ic:test:code
      - name: Stop PHPForge integration services
        if: always()
        shell: bash
        run: |
          docker compose -f .phpforge-workflow/resources/services/compose.yml \
            --profile mysql --profile postgres --profile redis --profile valkey --profile memcached \
            down --volumes --remove-orphans

  oauth-conformance:
    name: F7.8 OAuth interoperability/conformance coverage
    needs: select
    if: needs.select.outputs.gate == 'f7.8' || needs.select.outputs.gate == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Run complete available OAuth 2.1 protocol/conformance coverage
        run: >-
          vendor/bin/pest
          --configuration vendor/infocyph/phpforge/resources/pest.xml
          --fail-on-skipped
          tests/Feature/OAuth21*Test.php

  no-weakened-gates:
    name: F7.9 no weakened quality gates
    needs: select
    if: needs.select.outputs.gate == 'f7.9' || needs.select.outputs.gate == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: mbstring
          coverage: none
      - name: Reject suppression, baseline, exclusion and weakened-gate additions
        env:
          FOUNDATION_F7_BASE_REF: "2.0"
        run: php tools/f7-no-weakened-gates.php
