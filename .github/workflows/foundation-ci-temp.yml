name: Foundation CI Temp

on:
  push:
    branches:
      - feature/foundation-2.0
    paths:
      - '.github/workflows/foundation-ci-temp.yml'

# Final Foundation 2.0 validation; remove this temporary workflow after the run.
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/foundation-2.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer ic:ci
